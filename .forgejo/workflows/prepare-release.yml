name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v0.1.0-beta.2"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    name: Prepare release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: https://github.com/taiki-e/install-action@git-cliff

      - name: Validate requested version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu

          if ! printf '%s\n' "$VERSION" |
            grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Invalid release version: $VERSION"
            echo "Expected format such as v0.1.0-beta.2"
            exit 1
          fi

      - name: Create release branch
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu

          BRANCH="release/$VERSION"

          git config user.name "CMCEN Release Automation"
          git config user.email "release-automation@users.noreply.local"

          if git show-ref --verify --quiet "refs/heads/$BRANCH"; then
            echo "Local branch already exists: $BRANCH"
            exit 1
          fi

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Remote branch already exists: $BRANCH"
            exit 1
          fi

          git switch -c "$BRANCH"

      - name: Generate changelog
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu

          ./scripts/prepare-release.sh "$VERSION"

      - name: Review generated changes
        run: |
          set -eu

          git status --short
          git diff --check
          git diff -- CHANGELOG.md

      - name: Commit release preparation
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu

          git add CHANGELOG.md

          if git diff --cached --quiet; then
            echo "No changelog changes were generated."
            exit 1
          fi

          git diff --cached --check

          git commit -m "chore(release): prepare $VERSION"

      - name: Push release branch
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu

          git push origin "release/$VERSION"

      - name: Open and assign pull request
        env:
          VERSION: ${{ inputs.version }}
          FORGEJO_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
        run: |
          set -eu

          if [ -z "${FORGEJO_TOKEN:-}" ]; then
            echo "RELEASE_AUTOMATION_TOKEN is not configured."
            exit 1
          fi

          API_BASE="https://git.corebot.ca/api/v1"
          REPO_OWNER="Eric"
          REPO_NAME="CMCENDev"

          export BRANCH="release/$VERSION"
          export TITLE="chore(release): prepare $VERSION"
          export DESCRIPTION="Prepare $VERSION by updating CHANGELOG.md from Conventional Commit history since the previous release tag."

          PAYLOAD="$(
            python3 -c '
import json
import os

print(json.dumps({
    "head": os.environ["BRANCH"],
    "base": "main",
    "title": os.environ["TITLE"],
    "body": os.environ["DESCRIPTION"],
}))
'
          )"

          RESPONSE="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --request POST \
              --header "Authorization: token $FORGEJO_TOKEN" \
              --header "Content-Type: application/json" \
              --data "$PAYLOAD" \
              "$API_BASE/repos/$REPO_OWNER/$REPO_NAME/pulls"
          )"

          PR_NUMBER="$(
            printf '%s' "$RESPONSE" |
              python3 -c '
import json
import sys

response = json.load(sys.stdin)
print(response["number"])
'
          )"

          if [ -z "$PR_NUMBER" ]; then
            echo "Forgejo did not return a pull request number."
            exit 1
          fi

          echo "Created pull request #$PR_NUMBER"

          ASSIGNEE_PAYLOAD="$(
            python3 -c '
import json

print(json.dumps({
    "assignees": ["Bray", "Eric"]
}))
'
          )"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            --header "Authorization: token $FORGEJO_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$ASSIGNEE_PAYLOAD" \
            "$API_BASE/repos/$REPO_OWNER/$REPO_NAME/issues/$PR_NUMBER/assignees" \
            >/dev/null

          echo "Assigned pull request #$PR_NUMBER to Bray and Eric."
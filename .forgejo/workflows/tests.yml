name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  test:
    name: Node.js 24 test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: server

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Node.js 24 runtime
        run: |
          node --version
          node --eval "if (process.versions.node.split('.')[0] !== '24') process.exit(1)"

      - name: Restore npm download cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node-24-${{ hashFiles('server/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node-24-

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag cmcen-pr-test .

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: string }
    MessageId:
      name: messageId
      in: path
      required: true
      schema: { type: string }
    CommentId:
      name: commentId
      in: path
      required: true
      schema: { type: string }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
    RoleId:
      name: roleId
      in: path
      required: true
      schema: { type: string }
    PageId:
      name: pageId
      in: path
      required: true
      schema: { type: string }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string }
    TimerId:
      name: timerId
      in: path
      required: true
      schema: { type: string }
    CredentialID:
      name: credentialID
      in: path
      required: true
      schema: { type: string }
    ObjectKey:
      name: key
      in: path
      required: true
      schema: { type: string }
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    TranslationKey:
      name: key
      in: path
      required: true
      schema: { type: string }
    MigrationKey:
      name: migrationKey
      in: path
      required: true
      schema:
        type: string
        enum: [retirement, comments, lastPost]
    TempTokenQuery:
      name: tempToken
      in: query
      required: false
      schema: { type: string }
  requestBodies:
    GenericJson:
      required: false
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    Login:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [username, password]
            properties:
              username: { type: string }
              password: { type: string, format: password }
    AuthRegister:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    TotpVerify:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token]
            properties:
              token: { type: string }
              tempToken: { type: string }
    AnalyticsVisit:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              path: { type: string, example: /calendar }
              fullPath: { type: string }
              title: { type: string }
              referrer: { type: string }
              locale: { type: string, example: en-CA }
              timeZone: { type: string, example: America/Toronto }
    SiteConfigToken:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              configToken: { type: string }
    SiteConfigMigrationRun:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              mode:
                type: string
                enum: [dry-run, apply]
                default: dry-run
              limit:
                type: integer
                minimum: 1
                maximum: 1000
                nullable: true
                description: Optional maximum number of migration source records to process. Omit or send null to process all records.
    UploadUrl:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              filename: { type: string }
              contentType: { type: string }
              size: { type: integer, minimum: 0 }
              uploadSource:
                type: string
                enum: [retirementMessage, lastPostMessage, event, mediaManager, pageBuilder, migration, directUpload, legacyStorage, unknown]
              uploadContext: { type: string }
              sourceId: { type: string }
              sourceModel: { type: string }
              sourceField: { type: string }
              sourceUrl: { type: string }
              sourceSlug: { type: string }
              sourceName: { type: string }
    Banner:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BannerInput"
    Role:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RoleInput"
    Page:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    PageStatus:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status:
                type: string
                enum: [draft, published, archived]
    NavigationItem:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    Event:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    RetirementMessage:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    ReviewDecision:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              decision:
                type: string
                enum: [publish, reject, approve]
              status:
                type: string
              reason:
                type: string
    TranslationUpdate:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              en: { type: string }
              fr: { type: string }
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Message:
      description: Message response.
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    VersionResponse:
      type: object
      properties:
        commit: { type: string }
        shortCommit: { type: string }
    LocalizedText:
      type: object
      properties:
        en: { type: string }
        fr: { type: string }
    BannerInput:
      type: object
      properties:
        title: { type: string, maxLength: 120 }
        text:
          $ref: "#/components/schemas/LocalizedText"
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        textColor:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        startsAt:
          type: string
          format: date-time
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true
        countdownAt:
          type: string
          format: date-time
          nullable: true
        placement:
          type: string
          enum: [global, home]
        enabled:
          type: boolean
        order:
          type: number
    RoleInput:
      type: object
      properties:
        name: { type: string }
        slug: { type: string }
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        description: { type: string }
        permissions:
          type: array
          items: { type: string }

openapi: 3.1.0
info:
  title: CMCEN / RCMCE API
  version: 1.0.0
  description: >
    OpenAPI-style inventory for the Express routes mounted by server/server.js.
    Schemas are intentionally broad where handlers return Mongoose documents.
servers:
  - url: http://localhost:3000
    description: Local development (Eric)
  - url: http://localhost:3001
    description: Local development (Bray)
  - url: https://cmcen-staging.corebot.ca
    description: Staging
  - url: https://beta.cmcen-rcmce.ca
    description: Beta
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Auth
  - name: MFA
  - name: Analytics
  - name: Audit Log
  - name: Admin
  - name: Site Config
  - name: Uploads
  - name: Banners
  - name: Translations
  - name: Search
  - name: Pages
  - name: Events
  - name: Retirements
paths:
  /api/version:
    get:
      tags: [System]
      summary: Get running build version.
      security: []
      responses:
        "200":
          description: Build metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
  /api/data:
    get:
      tags: [System]
      summary: Public smoke-test endpoint.
      security: []
      responses:
        "200":
          $ref: "#/components/responses/Message"
  /api/protected_data:
    get:
      tags: [System]
      summary: Authenticated smoke-test endpoint.
      responses:
        "200":
          $ref: "#/components/responses/Message"
        "401":
          $ref: "#/components/responses/Error"
  /trade-options.js:
    get:
      tags: [System]
      summary: Get browser trade-options runtime.
      security: []
      responses:
        "200":
          description: JavaScript response.
  /api/content-options:
    get:
      tags: [System]
      summary: Get shared content option lists.
      security: []
      responses:
        "200":
          description: Content option data.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /translations.json:
    get:
      tags: [Translations]
      summary: Get public translation dictionary.
      security: []
      responses:
        "200":
          description: Translation dictionary.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /translations.js:
    get:
      tags: [Translations]
      summary: Get browser translation runtime.
      security: []
      responses:
        "200":
          description: JavaScript response.
  /api/translations:
    get:
      tags: [Translations]
      summary: List translations for admin editor.
      x-permission: canManageTranslations
      responses:
        "200":
          description: Translation rows.
  /api/translations/{key}:
    patch:
      tags: [Translations]
      summary: Update a translation key.
      x-permission: canManageTranslations
      parameters:
        - $ref: "#/components/parameters/TranslationKey"
      requestBody:
        $ref: "#/components/requestBodies/TranslationUpdate"
      responses:
        "200":
          description: Updated translation.
  /api/ghost/request:
    post:
      tags: [Auth]
      summary: Request ghost-account claim.
      security: []
      requestBody:
        $ref: "#/components/requestBodies/GenericJson"
      responses:
        "200":
          description: Claim request result.
  /api/ghost/confirm:
    post:
      tags: [Auth]
      summary: Confirm ghost-account claim.
      security: []
      requestBody:
        $ref: "#/components/requestBodies/GenericJson"
      responses:
        "200":
          description: Claim confirmation result.
  /api/register:
    post:
      tags: [Auth]
      summary: Register a user account.
      security: []
      requestBody:
        $ref: "#/components/requestBodies/AuthRegister"
      responses:
        "201":
          description: Registered user and token/verification state.
        "400":
          $ref: "#/components/responses/Error"
  /api/login:
    post:
      tags: [Auth]
      summary: Login with username and password.
      security: []
      requestBody:
        $ref: "#/components/requestBodies/Login"
      responses:
        "200":
          description: Login result; may require MFA.
  /api/email-verification/confirm:
    post:
      tags: [Auth]
      summary: Confirm email verification token.
      security: []
      requestBody:
        $ref: "#/components/requestBodies/GenericJson"
      responses:
        "200":
          description: Verification result.
  /api/password-reset/request:
    post:
      tags: [Auth]
      summary: Request password reset.
      security: []
      requestBody:
        $ref: "#/components/requestBodies/GenericJson"
      responses:
        "200":
          description: Reset request result.
  /api/password-reset/confirm:
    post:
      tags: [Auth]
      summary: Confirm password reset.
      security: []
      requestBody:
        $ref: "#/components/requestBodies/GenericJson"
      responses:
        "200":
          description: Reset confirmation result.
  /api/me:
    get:
      tags: [Auth]
      summary: Get current user.
      responses:
        "200":
          description: Current user, permissions, and notifications.
  /api/notifications:
    get:
      tags: [Auth]
      summary: Get user notifications.
      responses:
        "200":
          description: Notification summary.
  /api/ghost/upgrade:
    post:
      tags: [Auth]
      summary: Upgrade or merge ghost account.
      requestBody:
        $ref: "#/components/requestBodies/GenericJson"
      responses:
        "200":
          description: Upgrade result.
  /api/profile:
    patch:
      tags: [Auth]
      summary: Update current user profile.
      requestBody:
        $ref: "#/components/requestBodies/GenericJson"
      responses:
        "200":
          description: Updated user profile.
  /api/contributor-check:
    get:
      tags: [Auth]
      summary: Confirm contributor access.
      x-permission: canCreateDrafts
      responses:
        "200":
          $ref: "#/components/responses/Message"
  /api/admin-check:
    get:
      tags: [Auth]
      summary: Confirm admin access.
      responses:
        "200":
          $ref: "#/components/responses/Message"
  /api/mfa/webauthn/register/options:
    post:
      tags: [MFA]
      summary: Generate WebAuthn registration options.
      responses:
        "200":
          description: WebAuthn registration options.
  /api/mfa/webauthn/register/verify:
    post:
      tags: [MFA]
      summary: Verify WebAuthn registration.
      requestBody:
        $ref: "#/components/requestBodies/GenericJson"
      responses:
        "200":
          description: Stored credential result.
  /api/mfa/webauthn/authenticate/options:
    post:
      tags: [MFA]
      summary: Generate WebAuthn authentication options.
      parameters:
        - $ref: "#/components/parameters/TempTokenQuery"
      requestBody:
        $ref: "#/components/requestBodies/GenericJson"
      responses:
        "200":
          description: WebAuthn authentication options.
  /api/mfa/webauthn/authenticate/verify:
    post:
      tags: [MFA]
      summary: Verify WebAuthn authentication.
      parameters:
        - $ref: "#/components/parameters/TempTokenQuery"
      requestBody:
        $ref: "#/components/requestBodies/GenericJson"
      responses:
        "200":
          description: Authentication result; may include JWT.
  /api/mfa/totp/setup:
    post:
      tags: [MFA]
      summary: Initialize TOTP setup.
      responses:
        "200":
          description: TOTP secret, otpauth URL, and QR data.
  /api/mfa/totp/status:
    get:
      tags: [MFA]
      summary: Get TOTP status.
      responses:
        "200":
          description: TOTP status.
  /api/mfa/totp/qrcode:
    get:
      tags: [MFA]
      summary: Get TOTP QR code.
      responses:
        "200":
          description: TOTP QR code data.
  /api/mfa/totp/verify:
    post:
      tags: [MFA]
      summary: Verify TOTP code.
      parameters:
        - $ref: "#/components/parameters/TempTokenQuery"
      requestBody:
        $ref: "#/components/requestBodies/TotpVerify"
      responses:
        "200":
          description: Verification result; may include JWT.
  /api/mfa/totp:
    patch:
      tags: [MFA]
      summary: Rename TOTP app.
      requestBody:
        $ref: "#/components/requestBodies/GenericJson"
      responses:
        "200":
          description: Rename result.
    delete:
      tags: [MFA]
      summary: Disable TOTP.
      responses:
        "200":
          description: Disable result.
  /api/mfa/totp/rename:
    post:
      tags: [MFA]
      summary: Rename TOTP app, compatibility endpoint.
      requestBody:
        $ref: "#/components/requestBodies/GenericJson"
      responses:
        "200":
          description: Rename result.
  /api/mfa/webauthn/credentials:
    get:
      tags: [MFA]
      summary: List passkey credentials.
      responses:
        "200":
          description: Credential list.
  /api/mfa/webauthn/credentials/{credentialID}:
    patch:
      tags: [MFA]
      summary: Rename passkey credential.
      parameters:
        - $ref: "#/components/parameters/CredentialID"
      requestBody:
        $ref: "#/components/requestBodies/GenericJson"
      responses:
        "200":
          description: Rename result.
    delete:
      tags: [MFA]
      summary: Delete passkey credential.
      parameters:
        - $ref: "#/components/parameters/CredentialID"
      responses:
        "200":
          description: Delete result.
  /api/mfa/webauthn/cleanup:
    post:
      tags: [MFA]
      summary: Cleanup invalid passkey records.
      responses:
        "200":
          description: Updated credential list.
  /api/analytics:
    get:
      tags: [Analytics]
      summary: Get analytics summary.
      description: Returns visit totals and unique visitor totals. Registered visitors are deduplicated by user id; guest visitors are deduplicated by stored IP address and user agent. Role counts represent unique visitors by role, not raw page refreshes.
      x-permission: canViewAnalytics
      parameters:
        - name: range
          in: query
          schema:
            type: string
            enum: [7d, 30d, 90d, all]
            default: 30d
      responses:
        "200":
          description: Analytics summary.
  /api/analytics/visit:
    post:
      tags: [Analytics]
      summary: Record analytics visit.
      security: []
      requestBody:
        $ref: "#/components/requestBodies/AnalyticsVisit"
      responses:
        "204":
          description: Visit accepted.
  /api/audit-logs:
    get:
      tags: [Audit Log]
      summary: List audit log entries.
      x-permission: canViewAuditLog
      parameters:
        - name: action
          in: query
          schema: { type: string }
        - name: targetType
          in: query
          schema: { type: string }
        - name: user
          in: query
          schema: { type: string }
        - name: startDate
          in: query
          schema: { type: string, format: date }
        - name: endDate
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Audit logs.
  /api/audit-logs/export.csv:
    get:
      tags: [Audit Log]
      summary: Export audit log entries as CSV.
      x-permission: canViewAuditLog
      parameters:
        - name: action
          in: query
          schema: { type: string }
        - name: targetType
          in: query
          schema: { type: string }
        - name: user
          in: query
          schema: { type: string }
        - name: startDate
          in: query
          schema: { type: string, format: date }
        - name: endDate
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Audit log CSV export.
          content:
            text/csv:
              schema:
                type: string
  /api/admin/review-counts:
    get:
      tags: [Admin]
      summary: Get pending review counts.
      x-permission: canReviewAndPublish
      responses:
        "200":
          description: Review counts.
  /api/admin/roles:
    get:
      tags: [Admin]
      summary: List custom roles.
      x-permission: canManageRoles
      responses:
        "200":
          description: Roles and permission catalog.
    post:
      tags: [Admin]
      summary: Create custom role.
      x-permission: canManageRoles
      requestBody:
        $ref: "#/components/requestBodies/Role"
      responses:
        "201":
          description: Created role.
  /api/admin/roles/{roleId}:
    patch:
      tags: [Admin]
      summary: Update custom role.
      x-permission: canManageRoles
      parameters:
        - $ref: "#/components/parameters/RoleId"
      requestBody:
        $ref: "#/components/requestBodies/Role"
      responses:
        "200":
          description: Updated role.
    delete:
      tags: [Admin]
      summary: Delete custom role.
      x-permission: canManageRoles
      parameters:
        - $ref: "#/components/parameters/RoleId"
      responses:
        "200":
          description: Delete result.
  /api/admin/media:
    get:
      tags: [Admin, Uploads]
      summary: List media assets.
      description: Returns media assets with linked event, retirement, and Last Post usage metadata.
      x-permission: canViewMediaLibrary
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, oldest, name, size, orphaned]
      responses:
        "200":
          description: Media assets.
  /api/admin/media/bulk-delete:
    post:
      tags: [Admin, Uploads]
      summary: Delete selected unattached media assets.
      description: Deletes selected media assets by key. Attached media assets are skipped and returned in the response.
      x-permission: canDeleteMedia
      requestBody:
        $ref: "#/components/requestBodies/GenericJson"
      responses:
        "200":
          description: Bulk delete result.
  /api/admin/media/{key}:
    delete:
      tags: [Admin, Uploads]
      summary: Delete unattached media asset.
      x-permission: canDeleteMedia
      parameters:
        - $ref: "#/components/parameters/ObjectKey"
      responses:
        "200":
          description: Delete result.
        "409":
          $ref: "#/components/responses/Error"
  /api/admin/users:
    get:
      tags: [Admin]
      summary: List users.
      description: Returns lightweight user rows for the admin user manager. Use the user detail endpoint to load post summaries and editable detail for a selected user.
      x-permission: canReadUsers
      parameters:
        - name: query
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Users.
  /api/admin/users/{userId}:
    get:
      tags: [Admin]
      summary: Get user detail.
      x-permission: canReadUsers
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User detail.
    patch:
      tags: [Admin]
      summary: Update user admin assignments.
      x-permission: canManageUsers
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        $ref: "#/components/requestBodies/GenericJson"
      responses:
        "200":
          description: Updated user.
  /api/admin/users/{userId}/role:
    patch:
      tags: [Admin]
      summary: Update built-in role.
      x-permission: canManageUsers
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        $ref: "#/components/requestBodies/GenericJson"
      responses:
        "200":
          description: Updated role.
  /api/admin/users/{userId}/developer:
    patch:
      tags: [Admin]
      summary: Promote an administrator to developer.
      description: Requires canManageUsers plus an authenticated current user whose built-in role is developer. Only target users with the administrator role can be promoted; subscribers and other non-administrator accounts cannot be promoted directly.
      x-permission: canManageUsers
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        $ref: "#/components/requestBodies/GenericJson"
      responses:
        "200":
          description: Promotion result.
  /api/admin/events/{eventId}:
    delete:
      tags: [Admin, Events]
      summary: Delete any event.
      x-permission: canDeleteContent
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Delete result.
  /api/admin/retirement-messages/{messageId}:
    delete:
      tags: [Admin, Retirements]
      summary: Delete any retirement message.
      x-permission: canDeleteContent
      parameters:
        - $ref: "#/components/parameters/MessageId"
      responses:
        "200":
          description: Delete result.
  /api/admin/retirement-comments/{commentId}:
    delete:
      tags: [Admin, Retirements]
      summary: Delete any retirement comment.
      x-permission: canDeleteContent
      parameters:
        - $ref: "#/components/parameters/CommentId"
      responses:
        "200":
          description: Delete result.
  /api/admin/site-config/access:
    post:
      tags: [Site Config]
      summary: Log site config access request.
      x-permission: canAccessSiteConfig
      responses:
        "200":
          description: Access recorded.
  /api/admin/site-config/verify:
    post:
      tags: [Site Config]
      summary: Verify site-config token.
      x-permission: canAccessSiteConfig
      requestBody:
        $ref: "#/components/requestBodies/SiteConfigToken"
      responses:
        "200":
          description: Verification result.
  /api/admin/site-config:
    get:
      tags: [Site Config]
      summary: Read available site operations.
      x-permission: canAccessSiteConfig
      responses:
        "200":
          description: Available protected operations.
  /api/admin/site-config/migrations/{migrationKey}:
    post:
      tags: [Site Config]
      summary: Run a site migration.
      description: Streams newline-delimited JSON progress events while the migration process runs.
      x-permission: canManageSiteConfig
      parameters:
        - $ref: "#/components/parameters/MigrationKey"
      requestBody:
        $ref: "#/components/requestBodies/SiteConfigMigrationRun"
      responses:
        "200":
          description: Newline-delimited migration events.
          content:
            application/x-ndjson:
              schema:
                type: string
  /api/admin/site-config/analytics:
    delete:
      tags: [Site Config, Analytics]
      summary: Purge analytics history.
      description: Token-gated protected maintenance action.
      x-permission: canManageSiteConfig
      responses:
        "200":
          description: Purge result.
  /api/upload:
    post:
      tags: [Uploads]
      summary: Upload image through server.
      x-permission: canUploadMedia
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                uploadSource:
                  type: string
                  enum: [retirementMessage, lastPostMessage, event, mediaManager, pageBuilder, migration, directUpload, legacyStorage, unknown]
                  description: UI or workflow that initiated the upload.
                uploadContext:
                  type: string
                  description: Human-readable context such as retirement-message, last-post, event, or media-manager.
                sourceId:
                  type: string
                  description: Source content id when known.
                sourceModel:
                  type: string
                  description: Source model or content type when known.
                sourceField:
                  type: string
                  description: Source field that stores the media URL, such as photoUrl, imageUrl, or imagePath.
                sourceUrl:
                  type: string
                  description: Link back to the source content when known.
                sourceSlug:
                  type: string
                  description: Source slug when known.
                sourceName:
                  type: string
                  description: Name inferred from the source content, such as retiree, deceased member, or event title.
      responses:
        "201":
          description: Upload result with variants.
  /api/upload-url:
    post:
      tags: [Uploads]
      summary: Create signed direct-upload URL.
      x-permission: canUploadMedia
      requestBody:
        $ref: "#/components/requestBodies/UploadUrl"
      responses:
        "201":
          description: Signed upload URL.
  /api/image/{key}:
    get:
      tags: [Uploads]
      summary: Create signed image download URL.
      x-permission: canViewMediaLibrary
      parameters:
        - $ref: "#/components/parameters/ObjectKey"
      responses:
        "200":
          description: Signed URL.
  /api/timers/active:
    get:
      tags: [Banners]
      summary: List active public banners.
      security: []
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [global, home]
            default: global
      responses:
        "200":
          description: Active banners.
  /api/admin/timers:
    get:
      tags: [Banners]
      summary: List all banners.
      x-permission: canManageTimers
      responses:
        "200":
          description: Banners.
    post:
      tags: [Banners]
      summary: Create banner.
      x-permission: canManageTimers
      requestBody:
        $ref: "#/components/requestBodies/Banner"
      responses:
        "201":
          description: Created banner.
  /api/admin/timers/{timerId}:
    patch:
      tags: [Banners]
      summary: Update banner.
      x-permission: canManageTimers
      parameters:
        - $ref: "#/components/parameters/TimerId"
      requestBody:
        $ref: "#/components/requestBodies/Banner"
      responses:
        "200":
          description: Updated banner.
    delete:
      tags: [Banners]
      summary: Delete banner.
      x-permission: canManageTimers
      parameters:
        - $ref: "#/components/parameters/TimerId"
      responses:
        "200":
          description: Delete result.
  /api/search:
    get:
      tags: [Search]
      summary: Search public content.
      security: []
      parameters:
        - name: q
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Search results.
  /pages/{slug}:
    get:
      tags: [Pages]
      summary: Serve page shell.
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: HTML page shell.
  /api/navigation:
    get:
      tags: [Pages]
      summary: Get dynamic navigation.
      security: []
      responses:
        "200":
          description: Navigation items.
  /api/sitemap:
    get:
      tags: [Pages]
      summary: Get generated sitemap sections and links.
      security: []
      responses:
        "200":
          description: Generated sitemap from public HTML files and published pages.
  /api/pages/{slug}:
    get:
      tags: [Pages]
      summary: Get public page content.
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Page content.
  /api/admin/pages/{pageId}/preview:
    get:
      tags: [Pages]
      summary: Preview page.
      x-permission: canManagePages
      parameters:
        - $ref: "#/components/parameters/PageId"
      responses:
        "200":
          description: Page preview.
  /api/admin/pages:
    get:
      tags: [Pages]
      summary: List pages for admin.
      x-permission: canManagePages
      responses:
        "200":
          description: Admin page list.
    post:
      tags: [Pages]
      summary: Create page.
      x-permission: canManagePages
      requestBody:
        $ref: "#/components/requestBodies/Page"
      responses:
        "201":
          description: Created page.
  /api/admin/pages/media:
    get:
      tags: [Pages, Uploads]
      summary: List page-editor media assets.
      x-permission: canManagePages
      responses:
        "200":
          description: Media picker data.
  /api/admin/pages/{pageId}:
    get:
      tags: [Pages]
      summary: Get full admin page payload.
      x-permission: canManagePages
      parameters:
        - $ref: "#/components/parameters/PageId"
      responses:
        "200":
          description: Page payload.
    patch:
      tags: [Pages]
      summary: Update page.
      x-permission: canManagePages
      parameters:
        - $ref: "#/components/parameters/PageId"
      requestBody:
        $ref: "#/components/requestBodies/Page"
      responses:
        "200":
          description: Updated page.
    delete:
      tags: [Pages]
      summary: Delete page.
      x-permission: canManagePages
      parameters:
        - $ref: "#/components/parameters/PageId"
      responses:
        "200":
          description: Delete result.
  /api/admin/pages/{pageId}/status:
    patch:
      tags: [Pages]
      summary: Update page status.
      x-permission: canManagePages
      parameters:
        - $ref: "#/components/parameters/PageId"
      requestBody:
        $ref: "#/components/requestBodies/PageStatus"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: string }
    MessageId:
      name: messageId
      in: path
      required: true
      schema: { type: string }
    CommentId:
      name: commentId
      in: path
      required: true
      schema: { type: string }
    CertificateRequestId:
      name: certificateRequestId
      in: path
      required: true
      schema: { type: string }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
    RoleId:
      name: roleId
      in: path
      required: true
      schema: { type: string }
    PageId:
      name: pageId
      in: path
      required: true
      schema: { type: string }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string }
    TimerId:
      name: timerId
      in: path
      required: true
      schema: { type: string }
    CredentialID:
      name: credentialID
      in: path
      required: true
      schema: { type: string }
    ObjectKey:
      name: key
      in: path
      required: true
      schema: { type: string }
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    TranslationKey:
      name: key
      in: path
      required: true
      schema: { type: string }
    MigrationKey:
      name: migrationKey
      in: path
      required: true
      schema:
        type: string
        enum: [retirement, comments, lastPost]
    TempTokenQuery:
      name: tempToken
      in: query
      required: false
      schema: { type: string }
  requestBodies:
    GenericJson:
      required: false
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    Login:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [username, password]
            properties:
              username: { type: string }
              password: { type: string, format: password }
    AuthRegister:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    TotpVerify:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token]
            properties:
              token: { type: string }
              tempToken: { type: string }
    AnalyticsVisit:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              path: { type: string, example: /calendar }
              fullPath: { type: string }
              title: { type: string }
              referrer: { type: string }
              locale: { type: string, example: en-CA }
              timeZone: { type: string, example: America/Toronto }
    SiteConfigToken:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              configToken: { type: string }
    SiteConfigMigrationRun:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              mode:
                type: string
                enum: [dry-run, apply]
                default: dry-run
              limit:
                type: integer
                minimum: 1
                maximum: 1000
                nullable: true
                description: Optional maximum number of migration source records to process. Omit or send null to process all records.
    UploadUrl:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              filename: { type: string }
              contentType: { type: string }
              size: { type: integer, minimum: 0 }
              uploadSource:
                type: string
                enum:
                  [
                    retirementMessage,
                    lastPostMessage,
                    event,
                    mediaManager,
                    pageBuilder,
                    migration,
                    directUpload,
                    legacyStorage,
                    unknown,
                  ]
              uploadContext: { type: string }
              sourceId: { type: string }
              sourceModel: { type: string }
              sourceField: { type: string }
              sourceUrl: { type: string }
              sourceSlug: { type: string }
              sourceName: { type: string }
    Banner:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BannerInput"
    Role:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RoleInput"
    Page:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    PageStatus:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status:
                type: string
                enum: [draft, published, archived]
    NavigationItem:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    Event:
      required: true
      content:
        application/json:
          schema:
            type: object
            description: Event descriptions and registration instructions are limited to 10,000 characters per language.
            additionalProperties: true
    RetirementMessage:
      description: >-
        The `submitter` object accepts `relationship`; submitter contact details are derived from the authenticated profile on creation and preserved on updates. Message text is limited to 10,000 characters. A complete optional `certificateRequest` creates a separate pending certificate-request record. The retirement member's rank and MOSID/role are copied from `retiree`, and every certificate field is required except `member.ceBranchEnrollmentDate`. The message enters the review queue by default. Set `publishNow: true` only when the authenticated user has `canBypassReviewStages`.
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              publishNow:
                type: boolean
                description: Publish immediately when the authenticated user has `canBypassReviewStages`.
              certificateRequest:
                type: object
                required: [member, familyMembers, mailingAddress]
                properties:
                  member:
                    type: object
                    required:
                      [
                        fullName,
                        rankLanguage,
                        decorations,
                        lastUnit,
                        cafEnrollmentDate,
                        releaseDate,
                        neededByDate,
                        dwdParadeRequested,
                      ]
                    properties:
                      fullName: { type: string }
                      rankLanguage: { type: string, enum: [en, fr] }
                      decorations:
                        type: array
                        minItems: 1
                        items: { type: string }
                      lastUnit: { type: string }
                      cafEnrollmentDate: { type: string, format: date }
                      releaseDate: { type: string, format: date }
                      ceBranchEnrollmentDate: { type: string, format: date }
                      neededByDate: { type: string, format: date }
                      dwdParadeRequested: { type: boolean }
                  familyMembers:
                    type: array
                    items:
                      type: object
                      required: [relationship, fullName]
                      properties:
                        relationship: { type: string }
                        relationshipOther: { type: string }
                        fullName: { type: string }
                  mailingAddress:
                    type: object
                    required:
                      [line1, line2, city, province, postalCode, country]
                    properties:
                      line1: { type: string }
                      line2: { type: string }
                      city: { type: string }
                      province: { type: string }
                      postalCode: { type: string }
                      country: { type: string }
            additionalProperties: true
    ReviewDecision:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              decision:
                type: string
                enum: [publish, reject, approve]
              status:
                type: string
              reason:
                type: string
    EventReviewContent:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [language, content]
            properties:
              language:
                type: string
                enum: [en, fr]
              content:
                type: object
                required: [title, location, description, registration]
                properties:
                  title:
                    type: string
                    maxLength: 500
                  location:
                    type: string
                    maxLength: 500
                  description:
                    type: string
                    maxLength: 10000
                  registration:
                    type: string
                    maxLength: 10000
    RetirementReviewContent:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [language, message]
            properties:
              language:
                type: string
                enum: [en, fr]
              message:
                type: string
                minLength: 100
                maxLength: 10000
    LastPostReviewContent:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [language, message]
            properties:
              language:
                type: string
                enum: [en, fr]
              message:
                type: string
                maxLength: 10000
    TranslationUpdate:

[changelog]
header = """
# Changelog

All notable changes to CMCEN / RCMCE are documented in this file.

This changelog is generated from Conventional Commit history using git-cliff.

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}

{% for commit in commits %}
- {% if commit.scope %}{{ commit.scope }}: {% endif %}{{ commit.message | upper_first | trim }}
{% endfor %}

{% endfor %}
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true

# Older repository history predates enforced Conventional Commits.
# Keep this false until the changelog baseline tag has been established.
require_conventional = false

# Ignore historical commits that cannot be parsed as Conventional Commits.
filter_unconventional = true

split_commits = false
protect_breaking_commits = true

commit_parsers = [
  # Breaking changes must appear before their normal type parser.
  { message = "^[a-z]+(?:\\([^)]+\\))?!:", group = "Breaking Changes" },

  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs", group = "Documentation" },
  { message = "^build", group = "Build" },
  { message = "^ci", group = "CI" },
  { message = "^chore", group = "Maintenance" },
  { message = "^revert", group = "Reverts" },

  # Do not include test-only or formatting-only commits in release notes.
  { message = "^test", skip = true },
  { message = "^style", skip = true },

  # Ignore anything that does not match the supported groups.
  { message = ".*", skip = true },
]

filter_commits = false

# Match normal SemVer releases and SemVer prereleases, including:
#
#   v0.1.0
#   v0.1.0-beta.1
#   v0.1.0-rc.1
#   v1.0.0
#
# Tags outside this format are ignored by changelog version processing.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?$"

skip_tags = ""
ignore_tags = ""

# Process tags/commits in normal history order.
topo_order = false
sort_commits = "oldest"

[bump]
# CMCEN is currently using zero-based SemVer while in beta.
#
# A breaking change during the 0.x development period should remain within
# major version 0 rather than automatically promoting the project to v1.0.0.
features_always_bump_minor = true
breaking_always_bump_major = false

# These commit types should not independently trigger a version bump.
bump_minor_increment_pattern = "^feat"
bump_patch_increment_pattern = "^fix|^perf"

# Ignore repository-maintenance-only changes when determining a release bump.
skip_ci = true
skip_docs = true
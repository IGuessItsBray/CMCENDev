footer = """
<!-- generated by git-cliff -->
"""

trim = true

# Attribute known Bray and Eric identities by their preferred display names.
# For future work, use any other human Git author, then a human committer when
# the author is an agent. Historical agent-only commits use explicit
# maintainer-approved commit-ID mappings; known agent and automation identities
# are never shown as the person responsible for a change.

[git]
# Parse commit messages according to the Conventional Commits specification.
conventional_commits = true

# Historical repository commits predate enforcement of Conventional Commits.
# Keep this false so legacy history does not prevent changelog generation.
require_conventional = false

# Ignore commits that cannot be parsed as Conventional Commits.
filter_unconventional = true

# Treat each Git commit as a single changelog entry.
split_commits = false

# Breaking changes must not be accidentally filtered out by another parser.
protect_breaking_commits = true

commit_parsers = [
  # Breaking changes take precedence over their normal commit type.
  { message = "^[a-z]+(?:\\([^)]+\\))?!:", group = "Breaking Changes" },

  # User-facing and operational changes.
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs", group = "Documentation" },
  { message = "^build", group = "Build" },
  { message = "^ci", group = "CI" },
  { message = "^chore", group = "Maintenance" },
  { message = "^revert", group = "Reverts" },

  # Test-only and formatting-only changes are intentionally omitted from
  # release notes.
  { message = "^test", skip = true },
  { message = "^style", skip = true },

  # Ignore anything that does not match one of the supported groups above.
  { message = ".*", skip = true },
]

# Do not globally filter commits after the parser rules above have been
# applied.
filter_commits = false

# Recognize normal SemVer releases and SemVer prereleases, including:
#
#   v0.1.0
#   v0.1.0-beta.1
#   v0.1.0-beta.2
#   v0.1.0-rc.1
#   v1.0.0
#
# Tags outside this format are ignored for changelog version processing.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?$"

skip_tags = ""
ignore_tags = ""

# Preserve normal repository history ordering.
topo_order = false
sort_commits = "oldest"

[bump]
# CMCEN / RCMCE is currently using zero-major SemVer during development.
#
# Features increment the minor version when normal SemVer bump calculation is
# used.
features_always_bump_minor = true

# Breaking changes during 0.x development should not automatically promote the
# project to v1.0.0.
breaking_always_bump_major = false

# Commit types used when calculating normal SemVer increments.
bump_minor_increment_pattern = "^feat"
bump_patch_increment_pattern = "^fix|^perf"

# Documentation-only and CI-only changes do not independently require a
# version bump.
skip_ci = true
skip_docs = true

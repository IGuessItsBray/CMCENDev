services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cmcen}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cmcen-development-only}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  # Development-only and in-memory. Never use this service for production keys.
  openbao:
    image: openbao/openbao:2.6.2
    restart: unless-stopped
    command: server -dev -dev-root-token-id=${OPENBAO_DEV_ROOT_TOKEN:-cmcen-development-only-openbao-token}
    environment:
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "127.0.0.1:8200:8200"

volumes:
  mongo-data:
  minio-data:

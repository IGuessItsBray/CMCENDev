services:
  cmcen:
    image: ${CMCEN_IMAGE:?Set CMCEN_IMAGE in .env before starting the stack.}
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/cmcen
      MINIO_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY:?Set GARAGE_DEFAULT_ACCESS_KEY in .env.}
      MINIO_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY:?Set GARAGE_DEFAULT_SECRET_KEY in .env.}
      MINIO_BUCKET_NAME: ${GARAGE_DEFAULT_BUCKET:-cmcen}
      MINIO_ENDPOINT: http://garage:3900
    depends_on:
      mongo:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    ports:
      - "${CMCEN_BIND_ADDRESS:-127.0.0.1}:${CMCEN_PORT:-3000}:3000"

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  garage:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket", "--default-access-key"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?Set GARAGE_RPC_SECRET in .env.}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY:?Set GARAGE_DEFAULT_ACCESS_KEY in .env.}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY:?Set GARAGE_DEFAULT_SECRET_KEY in .env.}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_DEFAULT_BUCKET:-cmcen}
    ports:
      - "${GARAGE_BIND_ADDRESS:-127.0.0.1}:${GARAGE_S3_PORT:-3900}:3900"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  garage-init:
    image: dxflrs/garage:v2.4.1
    restart: "no"
    depends_on:
      garage:
        condition: service_healthy
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?Set GARAGE_RPC_SECRET in .env.}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
    entrypoint: ["/garage"]
    command: ["bucket", "allow", "--read", "--key", "anonymous", "${GARAGE_DEFAULT_BUCKET:-cmcen}"]

  plausible-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - plausible-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  plausible-events-db:
    image: clickhouse/clickhouse-server:24.12-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    volumes:
      - plausible-event-data:/var/lib/clickhouse
      - plausible-event-logs:/var/log/clickhouse-server
      - ./plausible/clickhouse/logs.xml:/etc/clickhouse-server/config.d/logs.xml:ro
      - ./plausible/clickhouse/ipv4-only.xml:/etc/clickhouse-server/config.d/ipv4-only.xml:ro
      - ./plausible/clickhouse/low-resources.xml:/etc/clickhouse-server/config.d/low-resources.xml:ro
      - ./plausible/clickhouse/default-profile-low-resources-overrides.xml:/etc/clickhouse-server/users.d/default-profile-low-resources-overrides.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  plausible:
    image: ghcr.io/plausible/community-edition:v3.2.1
    restart: unless-stopped
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    depends_on:
      plausible-db:
        condition: service_healthy
      plausible-events-db:
        condition: service_healthy
    environment:
      TMPDIR: /var/lib/plausible/tmp
      BASE_URL: ${PLAUSIBLE_BASE_URL:?Set PLAUSIBLE_BASE_URL in .env.}
      SECRET_KEY_BASE: ${PLAUSIBLE_SECRET_KEY_BASE:?Set PLAUSIBLE_SECRET_KEY_BASE in .env.}
      HTTP_PORT: "8000"
    ports:
      - "${PLAUSIBLE_BIND_ADDRESS:-127.0.0.1}:${PLAUSIBLE_PORT:-8000}:8000"
    volumes:
      - plausible-data:/var/lib/plausible
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

volumes:
  mongo-data:
  garage-meta:
  garage-data:
  plausible-db-data:
  plausible-event-data:
  plausible-event-logs:
  plausible-data:

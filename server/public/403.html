<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Access denied | CMCEN / RCMCE</title>
    <link rel="icon" type="image/png" href="https://cdn.corebot.ca/cmcen-demo/favicon_crest.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header id="header"></header>
    <main class="error-page-main">
      <section class="error-page" aria-labelledby="errorPageTitle">
        <p class="error-page-code" aria-hidden="true">403</p>
        <p class="error-page-eyebrow">Access denied</p>
        <h1 id="errorPageTitle">You do not have access to this page.</h1>
        <p>Your account does not have the permissions needed to view this content.</p>
        <div class="error-page-actions">
          <a class="error-page-primary-action" href="/dashboard">My account</a>
          <a class="error-page-secondary-action" href="/index">Return home</a>
        </div>
      </section>
    </main>
    <footer id="footer"></footer>
    <script src="/app-utils.js"></script>
    <script src="/timers.js"></script>
    <script src="/index.js"></script>
    <script src="/translations.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Something went wrong | CMCEN / RCMCE</title>
    <link
      rel="icon"
      type="image/png"
      href="https://cdn.corebot.ca/cmcen-demo/favicon_crest.png"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header id="header"></header>
    <main class="error-page-main">
      <section class="error-page" aria-labelledby="errorPageTitle">
        <p class="error-page-code" aria-hidden="true">500</p>
        <p class="error-page-eyebrow">Something went wrong</p>
        <h1 id="errorPageTitle">We could not complete that request.</h1>
        <p>
          Please try again in a moment. If the problem continues, return home
          and try a different route.
        </p>
        <div class="error-page-actions">
          <a class="error-page-primary-action" href="/index">Return home</a>
          <a class="error-page-secondary-action" href="/search"
            >Search the site</a
          >
        </div>
      </section>
    </main>
    <footer id="footer"></footer>
    <script src="/app-utils.js"></script>
    <script src="/timers.js"></script>
    <script src="/index.js"></script>
    <script src="/translations.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title data-i18n="archive_staff_title">Imported archive review</title>
    <script src="/dashboard-next-theme.js"></script>
    <link rel="stylesheet" href="/theme-tokens.css" />
    <link rel="stylesheet" href="/dashboard-next-theme.css" />
    <link rel="stylesheet" href="/archive-staff-review.css" />
    <script src="/app-utils.js" defer></script>
    <script src="/translations.js" defer></script>
    <script src="/newsletter-format.js" defer></script>
    <script src="/archive-staff-review.js" defer></script>
  </head>
  <body>
    <main class="archive-staff-shell">
      <header class="archive-staff-header">
        <div>
          <p class="archive-staff-eyebrow">CMCEN / RCMCE</p>
          <h1 data-i18n="archive_staff_heading">Imported archive review</h1>
          <p data-i18n="archive_staff_intro">Compare each imported draft with its original source, correct it, record your checks, then publish it.</p>
        </div>
        <a href="/dashboard-next" data-i18n="archive_staff_admin">Administration</a>
      </header>
      <p id="archiveStaffMessage" role="status" aria-live="polite"></p>
      <div id="archiveStaffApp" hidden>
        <div class="archive-staff-controls">
          <label
            ><span data-i18n="archive_staff_content_type">Content type</span>
            <select id="archiveStaffType"></select>
          </label>
          <label
            ><span data-i18n="archive_staff_status">Status</span>
            <select id="archiveStaffStatus">
              <option value="draft" data-i18n="archive_staff_drafts">Drafts</option>
              <option value="published" data-i18n="archive_staff_published">Published</option>
            </select>
          </label>
        </div>
        <div class="archive-staff-layout">
          <aside class="archive-staff-queue">
            <h2 data-i18n="archive_staff_records">Imported records</h2>
            <p id="archiveStaffProgress" role="status"></p>
            <div id="archiveStaffQueue"></div>
            <button id="archiveStaffMore" type="button" hidden>
              <span data-i18n="archive_staff_load_more">Load more</span>
            </button>
          </aside>
          <section
            id="archiveStaffDetail"
            class="archive-staff-detail"
            aria-label="Record review"
            data-i18n-aria-label="archive_staff_record_review"
          >
            <p data-i18n="archive_staff_select_draft">Select an imported draft.</p>
          </section>
        </div>
      </div>
    </main>
  </body>
</html>

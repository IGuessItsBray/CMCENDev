<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>
      Audit Log | CMCEN / RCMCE
    </title>

    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <header id="header"></header>

    <main class="dashboard-main">
      <section
        class="dashboard-shell audit-log-shell"
        aria-labelledby="auditLogTitle"
      >
        <header class="dashboard-heading">
          <div class="dashboard-heading-copy">
            <p class="dashboard-eyebrow">
              Administrator
            </p>

            <h1 id="auditLogTitle">
              Audit log
            </h1>

            <p class="dashboard-member-name">
              Review logins, publishing, deletions, and role changes.
            </p>
          </div>
        </header>

        <div
          class="dashboard-status is-loading"
          id="auditLogStatus"
          role="status"
          aria-live="polite"
          aria-label="Loading..."
        >
          <span class="loading-state-spinner" aria-hidden="true"></span>
          <span class="visually-hidden">Loading...</span>
        </div>

        <section
          class="dashboard-section audit-log-page"
          id="auditLogPage"
          hidden
        >
          <nav
            class="admin-work-zone-tabs admin-work-zone-page-tabs"
            aria-label="Admin work zone views"
          >
            <a class="admin-work-zone-tab" href="/admin-users.html">
              Users
            </a>
            <a class="admin-work-zone-tab" href="/admin-users.html?view=media">
              Media Manager
            </a>
            <a class="admin-work-zone-tab" href="/translations-admin.html">
              Translations
            </a>
            <a
              class="admin-work-zone-tab is-active"
              href="/audit-log.html"
              aria-current="page"
            >
              Audit Log
            </a>
          </nav>

          <div
            class="audit-log-content"
            id="auditLogContent"
          ></div>
        </section>
      </section>
    </main>

    <footer id="footer"></footer>

    <script src="/index.js"></script>
    <script src="/translations.js"></script>
    <script src="/audit-log.js"></script>
  </body>
</html>

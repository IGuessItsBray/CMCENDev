<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title data-i18n="audit_log_page_title">
      Audit Log | CMCEN / RCMCE
    </title>
    <link rel="icon" type="image/png" href="https://cdn.corebot.ca/cmcen-demo/favicon_crest.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <header id="header"></header>

    <main class="dashboard-main">
      <section
        class="dashboard-shell admin-work-zone-dashboard-shell"
        aria-labelledby="auditLogTitle"
      >
        <header class="dashboard-heading">
          <div class="dashboard-heading-copy">
            <p
              class="dashboard-eyebrow"
              data-i18n="admin_work_zone_eyebrow"
            >
              Administrator
            </p>

            <h1
              id="auditLogTitle"
              data-i18n="audit_log_heading"
            >
              Audit log
            </h1>

            <p
              class="dashboard-member-name"
              data-i18n="audit_log_intro"
            >
              Review logins, publishing, deletions, and role changes.
            </p>
          </div>
        </header>

        <nav
          class="admin-work-zone-tabs admin-work-zone-page-tabs"
          id="adminWorkZoneTabs"
          aria-label="Admin work zone views"
          data-i18n-aria-label="admin_work_zone_tabs_label"
        ></nav>

        <div
          class="dashboard-status is-loading"
          id="auditLogStatus"
          role="status"
          aria-live="polite"
          aria-label="Loading..."
          data-i18n-aria-label="loading_text"
        >
          <span class="loading-state-spinner" aria-hidden="true"></span>
          <span class="visually-hidden" data-i18n="loading_text">Loading...</span>
        </div>

        <section
          class="dashboard-section audit-log-page"
          id="auditLogPage"
          hidden
        >
          <div
            class="audit-log-content"
            id="auditLogContent"
          ></div>
        </section>
      </section>
    </main>

    <footer id="footer"></footer>

    <script src="/app-utils.js"></script>
    <script src="/timers.js"></script>
    <script src="/index.js"></script>
    <script src="/translations.js"></script>
    <script src="/admin-work-zone-tabs.js"></script>
    <script src="/date-time-picker.js"></script>
    <script src="/audit-log.js"></script>
  </body>
</html>

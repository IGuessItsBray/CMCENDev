<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Professional Awards | CMCEN / RCMCE</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header id="header"></header>
    <main class="about-family-main">
      <article class="about-family-shell professional-awards-shell">
        <header class="about-family-hero">
          <div class="about-family-hero-copy">
            <p class="about-family-kicker">Recognition</p>
            <h1>Professional Awards</h1>
            <p class="about-family-intro">
              Honours, awards, nomination guidance, and recipient records for
              the C&amp;E community.
            </p>
            <a
              class="professional-awards-manage-link"
              id="professionalAwardsManageLink"
              href="/professional-awards-admin"
              hidden
              >Manage awards</a
            >
          </div>
          <img src="/images/logo.png" alt="" class="about-family-emblem" />
        </header>
        <div
          class="about-family-body"
          id="professionalAwards"
          aria-live="polite"
        >
          <section
            class="professional-awards-highlights"
            id="professionalAwardsHighlights"
            aria-label="Current award recipients"
          ></section>
          <section
            class="professional-awards-archive"
            aria-labelledby="professionalAwardsArchiveTitle"
          >
            <div class="professional-awards-archive-heading">
              <div>
                <p class="professional-awards-section-kicker">Award archive</p>
                <h2 id="professionalAwardsArchiveTitle">Explore the awards</h2>
              </div>
              <div class="professional-awards-toolbar">
                <label for="professionalAwardsSearch">Search recipients</label>
                <input
                  id="professionalAwardsSearch"
                  type="search"
                  placeholder="Search recipient names across all awards"
                  autocomplete="off"
                />
              </div>
            </div>
            <div
              class="professional-awards-tabs"
              id="professionalAwardsTabs"
              role="tablist"
              aria-label="Professional award categories"
            ></div>
            <label
              class="professional-awards-select-label"
              for="professionalAwardsSelect"
            >
              Award category
            </label>
            <select
              class="professional-awards-select"
              id="professionalAwardsSelect"
              aria-label="Professional award category"
            ></select>
          </section>
          <div
            class="professional-awards-panel"
            id="professionalAwardsPanel"
            role="tabpanel"
          >
            <p>Loading professional awards…</p>
          </div>
        </div>
      </article>
    </main>
    <footer id="footer"></footer>
    <script src="/app-utils.js"></script>
    <script src="/timers.js"></script>
    <script src="/index.js"></script>
    <script src="/translations.js"></script>
    <script src="/awards.js"></script>
  </body>
</html>

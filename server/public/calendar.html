<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="calendar_title"></title>
    <link
      rel="icon"
      type="image/png"
      href="https://cdn.corebot.ca/cmcen-demo/favicon_crest.png"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <header id="header"></header>
    <main class="calendar-main">
      <section class="calendar-container">
        <header class="calendar-heading">
          <div class="calendar-heading-copy">
            <p class="calendar-kicker" data-i18n="calendar_kicker"></p>
            <h1 data-i18n="calendar_title"></h1>
          </div>
          <div class="calendar-submit-callout">
            <p data-i18n="calendar_submit_prompt"></p>
            <a
              href="/submit-event"
              data-i18n="calendar_submit_button"
            ></a>
          </div>
        </header>

        <p
          id="calendarMessage"
          class="calendar-message"
          data-i18n="loading_events"
        >
          Loading events...
        </p>

        <section
          class="calendar-tools"
          aria-labelledby="calendarFiltersHeading"
        >
          <h2
            id="calendarFiltersHeading"
            class="calendar-tools-heading"
            data-i18n="calendar_filters_heading"
          >
            Filter events
          </h2>

          <div class="calendar-filter-fields">
            <div class="calendar-filter-field">
              <label for="calendarEventTypeFilter" data-i18n="event_type">
                Event type
              </label>
              <select id="calendarEventTypeFilter">
                <option value="" data-i18n="calendar_filter_all_event_types">
                  All event types
                </option>
                <option value="conference" data-i18n="event_type_conference">
                  Conference
                </option>
                <option
                  value="mess-function"
                  data-i18n="event_type_mess_function"
                >
                  Mess function
                </option>
                <option value="ceremony" data-i18n="event_type_ceremony">
                  Ceremony
                </option>
                <option value="training" data-i18n="event_type_training">
                  Training
                </option>
                <option value="social" data-i18n="event_type_social">
                  Social
                </option>
                <option value="other" data-i18n="event_type_other">
                  Other
                </option>
              </select>
            </div>

            <div class="calendar-filter-field">
              <label
                for="calendarOrganizingEntityFilter"
                data-i18n="event_organizing_entity"
              >
                Organizing entity
              </label>
              <select id="calendarOrganizingEntityFilter">
                <option value="" data-i18n="calendar_filter_all_organizers">
                  All organizing entities
                </option>
                <option value="branch" data-i18n="entity_branch">
                  C&E Branch
                </option>
                <option value="association" data-i18n="entity_association">
                  C&E Association
                </option>
                <option value="foundation" data-i18n="entity_foundation">
                  C&E Foundation
                </option>
                <option value="museum" data-i18n="entity_museum">
                  C&E Museum
                </option>
              </select>
            </div>

            <div class="calendar-filter-field">
              <label
                for="calendarProvinceRegionFilter"
                data-i18n="event_province_region"
              >
                Province or region
              </label>
              <select id="calendarProvinceRegionFilter">
                <option value="" data-i18n="calendar_filter_all_regions">
                  All provinces and regions
                </option>
                <option value="AB" data-i18n="region_ab">Alberta</option>
                <option value="BC" data-i18n="region_bc">
                  British Columbia
                </option>
                <option value="MB" data-i18n="region_mb">Manitoba</option>
                <option value="NB" data-i18n="region_nb">New Brunswick</option>
                <option value="NL" data-i18n="region_nl">
                  Newfoundland and Labrador
                </option>
                <option value="NS" data-i18n="region_ns">Nova Scotia</option>
                <option value="NT" data-i18n="region_nt">
                  Northwest Territories
                </option>
                <option value="NU" data-i18n="region_nu">Nunavut</option>
                <option value="ON" data-i18n="region_on">Ontario</option>
                <option value="PE" data-i18n="region_pe">
                  Prince Edward Island
                </option>
                <option value="QC" data-i18n="region_qc">Quebec</option>
                <option value="SK" data-i18n="region_sk">Saskatchewan</option>
                <option value="YT" data-i18n="region_yt">Yukon</option>
                <option value="International" data-i18n="region_international">
                  International
                </option>
              </select>
            </div>
          </div>

          <div class="calendar-tool-actions">
            <button
              type="button"
              class="calendar-clear-filters-button"
              id="calendarClearFiltersButton"
              data-i18n="calendar_clear_filters"
            >
              Clear filters
            </button>
            <button
              type="button"
              class="calendar-download-button"
              id="calendarDownloadButton"
              data-i18n="calendar_download"
            >
              Download .ics
            </button>
          </div>
        </section>

        <section class="calendar-view" aria-labelledby="calendarMonthLabel">
          <div class="calendar-controls">
            <div class="calendar-month-navigation">
              <button
                type="button"
                class="calendar-navigation-button"
                id="calendarPreviousButton"
                data-i18n-aria-label="calendar_previous_month"
              >
                <span aria-hidden="true">←</span>
              </button>

              <h2
                id="calendarMonthLabel"
                class="calendar-display-month"
                aria-live="polite"
              ></h2>

              <button
                type="button"
                class="calendar-navigation-button"
                id="calendarNextButton"
                data-i18n-aria-label="calendar_next_month"
              >
                <span aria-hidden="true">→</span>
              </button>
            </div>

            <div class="calendar-view-actions">
              <button
                type="button"
                class="calendar-today-button"
                id="calendarTodayButton"
                data-i18n="calendar_today"
              >
                Today
              </button>

              <div
                class="calendar-view-toggle"
                role="group"
                data-i18n-aria-label="calendar_view_options"
              >
                <button
                  type="button"
                  class="calendar-view-toggle-button"
                  id="calendarMonthViewButton"
                  data-calendar-view="month"
                  data-i18n="calendar_view_month"
                >
                  Month
                </button>

                <button
                  type="button"
                  class="calendar-view-toggle-button"
                  id="calendarAgendaViewButton"
                  data-calendar-view="agenda"
                  data-i18n="calendar_view_agenda"
                >
                  Agenda
                </button>
              </div>
            </div>
          </div>

          <div class="calendar-grid-scroll">
            <div
              class="calendar-weekdays"
              id="calendarWeekdays"
              aria-hidden="true"
            ></div>
            <div
              id="calendarGrid"
              class="calendar-grid"
              aria-live="polite"
            ></div>
          </div>

          <section
            id="eventList"
            class="calendar-agenda"
            aria-labelledby="calendarAgendaHeading"
            hidden
          >
            <h2
              id="calendarAgendaHeading"
              class="visually-hidden"
              data-i18n="calendar_agenda_heading"
            >
              Events in this view
            </h2>
          </section>
        </section>
      </section>
    </main>

    <footer id="footer"></footer>

    <script src="/app-utils.js"></script>
    <script src="/timers.js"></script>
    <script src="/index.js"></script>
    <script src="/translations.js"></script>
    <script src="/calendar.js"></script>
  </body>
</html>

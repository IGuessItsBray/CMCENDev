<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title data-i18n="calendar_title">Events Calendar</title>

    <link rel="stylesheet" href="/styles.css" />
</head>

<body>
    <header id="header"></header>

    <main class="calendar-main">
        <section class="calendar-container">
            <header class="calendar-heading">
                <h1 data-i18n="calendar_title">
                    Events Calendar
                </h1>

                <p data-i18n="calendar_intro">
                    Upcoming events in chronological order.
                </p>
            </header>

            <p id="calendarMessage" class="calendar-message" data-i18n="loading_events">
                Loading events...
            </p>

            <div id="eventList"></div>
        </section>
    </main>

    <footer id="footer"></footer>

    <script src="/index.js"></script>
    <script src="/translations.js"></script>
    <script src="/calendar.js"></script>
</body>

</html>

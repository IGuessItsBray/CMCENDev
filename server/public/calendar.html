<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="calendar_title"></title>
    <link rel="stylesheet" href="/styles.css" />
</head>

<body>
    <header id="header"></header>
    <main class="calendar-main">
        <section class="calendar-container">
            <header class="calendar-heading">
                <div class="calendar-heading-copy">
                    <p class="calendar-kicker" data-i18n="calendar_kicker"></p>
                    <h1 data-i18n="calendar_title"></h1>
                </div>
                <div class="calendar-submit-callout">
                    <p data-i18n="calendar_submit_prompt"></p>
                    <a href="/submit-event.html?panel=form" data-i18n="calendar_submit_button"></a>
                </div>
            </header>

            <p id="calendarMessage" class="calendar-message" data-i18n="loading_events">
                Loading events...
            </p>

            <div id="eventList"></div>
        </section>
    </main>

    <footer id="footer"></footer>

    <script src="/app-utils.js"></script>
    <script src="/index.js"></script>
    <script src="/translations.js"></script>
    <script src="/calendar.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title data-i18n="dashboard_page_title">
      Account Dashboard | CMCEN / RCMCE
    </title>

    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <header id="header"></header>

    <main class="dashboard-main">
      <section
        class="dashboard-shell"
        aria-labelledby="dashboardTitle"
      >
        <header class="dashboard-heading">
          <div class="dashboard-heading-copy">
            <p
              class="dashboard-eyebrow"
              data-i18n="dashboard_member_account"
            >
              Member account
            </p>

            <h1
              id="dashboardTitle"
            >
              Loading...
            </h1>

            <p
              class="dashboard-member-name"
              id="dashboardMemberName"
              hidden
            >
              Loading...
            </p>
          </div>

          <div
            class="dashboard-role-summary"
            id="dashboardRoleSummary"
            hidden
          >
            <span
              class="dashboard-role-badge"
              id="dashboardRoleBadge"
            ></span>

            <p id="dashboardRoleDescription"></p>
          </div>
        </header>

        <div
          class="dashboard-status"
          id="dashboardStatus"
          aria-live="polite"
        >
          <p data-i18n="loading_text">
            Loading...
          </p>
        </div>

        <div
          class="dashboard-content"
          id="dashboardContent"
          hidden
        >
          <section
            class="dashboard-section"
            aria-labelledby="accountDetailsTitle"
          >
            <header class="dashboard-section-heading">
              <h2
                id="accountDetailsTitle"
                data-i18n="dashboard_account_details"
              >
                Account details
              </h2>
            </header>

            <div
              class="dashboard-details"
              id="dashboardDetails"
            ></div>
          </section>

          <aside
            class="dashboard-section dashboard-actions-section"
            aria-labelledby="availableActionsTitle"
          >
            <header class="dashboard-section-heading">
              <h2
                id="availableActionsTitle"
                data-i18n="dashboard_available_actions"
              >
                Available actions
              </h2>
            </header>

            <nav
              class="dashboard-actions"
              id="dashboardActions"
              aria-label="Account actions"
            ></nav>
          </aside>

          <section class="dashboard-section" aria-labelledby="mfaTitle">
            <header class="dashboard-section-heading">
              <h2 id="mfaTitle">Multi-factor authentication</h2>
            </header>

            <div id="mfaArea">
              <form id="login-form">
                <h3>Login</h3>
                <label>
                  <input id="login-username" placeholder="Email" required />
                </label>
                <label>
                  <input id="login-password" type="password" placeholder="Password" required />
                </label>
                <div>
                  <button type="submit">Login</button>
                  <button type="button" id="logout-button">Logout</button>
                </div>
              </form>

              <div id="mfa-config" hidden>
                <h3>TOTP</h3>
                <button id="totp-setup">Setup TOTP</button>
                <div id="totp-otpauth" style="word-break:break-all;margin-top:8px"></div>
                <input id="totp-code" placeholder="Enter TOTP code" />
                <button id="totp-verify">Verify TOTP</button>

                <h3 style="margin-top:16px">Passkey</h3>
                <button id="webauthn-register">Register Passkey</button>
                <button id="webauthn-authenticate">Authenticate with Passkey</button>
              </div>
            </div>
          </section>
        </div>
      </section>
    </main>

    <footer id="footer"></footer>

    <script src="/index.js"></script>
    <script src="/translations.js"></script>
    <script src="/dashboard.js"></script>
    <script src="/dashboard-mfa.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title data-i18n="dashboard_page_title">
      Account Dashboard | CMCEN / RCMCE
    </title>

    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <header id="header"></header>

    <main class="dashboard-main">
      <section
        class="app-shell dashboard-shell"
        aria-labelledby="dashboardTitle"
      >
        <header class="app-page-header">
          <div class="app-page-header-copy">
            <p
              class="app-eyebrow"
              data-i18n="dashboard_member_account"
            >
              Member account
            </p>

            <h1
              class="app-page-title"
              id="dashboardTitle"
              data-i18n="dashboard_title"
            >
              Account Dashboard
            </h1>

            <p
              class="app-page-summary"
              id="dashboardMemberName"
              hidden
            ></p>
          </div>

          <div
            class="dashboard-role-summary"
            id="dashboardRoleSummary"
            hidden
          >
            <span
              class="dashboard-role-badge"
              id="dashboardRoleBadge"
            ></span>

            <p id="dashboardRoleDescription"></p>
          </div>
        </header>

        <div
          class="app-status is-loading is-large dashboard-status"
          id="dashboardStatus"
          role="status"
          aria-live="polite"
          aria-label="Loading..."
        >
          <span class="loading-state-spinner" aria-hidden="true"></span>
          <span class="visually-hidden" data-i18n="loading_text">
            Loading...
          </span>
        </div>

        <div
          class="dashboard-content"
          id="dashboardContent"
          hidden
        >
          <section
            class="dashboard-section"
            aria-labelledby="accountDetailsTitle"
          >
            <header class="app-section-heading">
              <h2
                id="accountDetailsTitle"
                data-i18n="dashboard_account_details"
              >
                Account details
              </h2>
            </header>

            <div
              class="dashboard-details"
              id="dashboardDetails"
            ></div>
          </section>

          <aside
            class="dashboard-section dashboard-actions-section"
            aria-labelledby="availableActionsTitle"
          >
            <header class="app-section-heading">
              <h2
                id="availableActionsTitle"
                data-i18n="dashboard_available_actions"
              >
                Available actions
              </h2>
            </header>

            <nav
              class="dashboard-actions"
              id="dashboardActions"
              aria-label="Account actions"
            ></nav>
          </aside>

          <section
            class="dashboard-section dashboard-mfa-section"
            aria-labelledby="mfaTitle"
          >
            <header class="app-section-heading">
              <h2
                id="mfaTitle"
                data-i18n="dashboard_mfa_title"
              >
                Multi-factor authentication
              </h2>
            </header>

            <div
              class="dashboard-mfa-grid"
              id="mfa-config"
            >
              <div class="app-panel mfa-panel">
                <h3 data-i18n="mfa_totp_title">TOTP</h3>

                <div class="mfa-actions">
                  <button
                    class="app-button is-primary mfa-button"
                    id="totp-setup"
                    type="button"
                    data-i18n="mfa_setup_totp"
                  >
                    Setup TOTP
                  </button>
                </div>

                <div
                  class="mfa-output"
                  id="totp-otpauth"
                  aria-live="polite"
                ></div>

                <div class="mfa-verification-row">
                  <label class="mfa-field">
                    <span data-i18n="mfa_authenticator_code">
                      Authenticator code
                    </span>
                    <input
                      id="totp-code"
                      inputmode="numeric"
                      autocomplete="one-time-code"
                      placeholder="000000"
                    />
                  </label>

                  <button
                    class="app-button is-secondary mfa-button"
                    id="totp-verify"
                    type="button"
                    data-i18n="mfa_verify"
                  >
                    Verify
                  </button>
                </div>

                <div
                  class="totp-manager"
                  aria-labelledby="totpStatusTitle"
                >
                  <div class="passkey-manager-heading">
                    <h4
                      id="totpStatusTitle"
                      data-i18n="mfa_totp_status_title"
                    >
                      Authenticator app status
                    </h4>

                    <button
                      class="mfa-link-button"
                      id="totp-refresh"
                      type="button"
                      data-i18n="mfa_refresh"
                    >
                      Refresh
                    </button>
                  </div>

                  <div
                    class="totp-status"
                    id="totp-status"
                    aria-live="polite"
                  ></div>
                </div>
              </div>

              <div class="app-panel mfa-panel">
                <h3 data-i18n="mfa_passkey_title">Passkey</h3>

                <div class="mfa-actions">
                  <button
                    class="app-button is-primary mfa-button"
                    id="webauthn-register"
                    type="button"
                    data-i18n="mfa_register_passkey"
                  >
                    Register Passkey
                  </button>

                  <button
                    class="app-button is-secondary mfa-button"
                    id="webauthn-authenticate"
                    type="button"
                    data-i18n="mfa_authenticate"
                  >
                    Authenticate
                  </button>
                </div>

                <div
                  class="passkey-manager"
                  aria-labelledby="passkeyListTitle"
                >
                  <div class="passkey-manager-heading">
                    <h4
                      id="passkeyListTitle"
                      data-i18n="mfa_registered_passkeys_title"
                    >
                      Registered passkeys
                    </h4>

                    <button
                      class="mfa-link-button"
                      id="passkey-refresh"
                      type="button"
                      data-i18n="mfa_refresh"
                    >
                      Refresh
                    </button>
                  </div>

                  <div
                    class="passkey-list"
                    id="passkey-list"
                    aria-live="polite"
                  ></div>
                </div>
              </div>
            </div>
          </section>
        </div>
      </section>
    </main>

    <footer id="footer"></footer>

    <script src="/app-utils.js"></script>
    <script src="/index.js"></script>
    <script src="/translations.js"></script>
    <script src="/validation-i18n.js"></script>
    <script src="/trade-options.js"></script>
    <script src="/dashboard.js"></script>
    <script src="/dashboard-mfa.js"></script>
  </body>
</html>

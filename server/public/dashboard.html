<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title data-i18n="dashboard_page_title">
      Account Dashboard | CMCEN / RCMCE
    </title>

    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <header id="header"></header>

    <main class="dashboard-main">
      <section
        class="dashboard-shell"
        aria-labelledby="dashboardTitle"
      >
        <header class="dashboard-heading">
          <div class="dashboard-heading-copy">
            <p
              class="dashboard-eyebrow"
              data-i18n="dashboard_member_account"
            >
              Member account
            </p>

            <h1
              id="dashboardTitle"
              data-i18n="dashboard_title"
            >
              Account Dashboard
            </h1>

            <p
              class="dashboard-member-name"
              id="dashboardMemberName"
              hidden
            ></p>
          </div>

          <div
            class="dashboard-role-summary"
            id="dashboardRoleSummary"
            hidden
          >
            <span
              class="dashboard-role-badge"
              id="dashboardRoleBadge"
            ></span>

            <p id="dashboardRoleDescription"></p>
          </div>
        </header>

        <div
          class="dashboard-status is-loading"
          id="dashboardStatus"
          role="status"
          aria-live="polite"
          aria-label="Loading..."
        >
          <span class="loading-state-spinner" aria-hidden="true"></span>
          <span class="visually-hidden" data-i18n="loading_text">
            Loading...
          </span>
        </div>

        <div
          class="dashboard-content"
          id="dashboardContent"
          hidden
        >
          <section
            class="dashboard-section"
            aria-labelledby="accountDetailsTitle"
          >
            <header class="dashboard-section-heading">
              <h2
                id="accountDetailsTitle"
                data-i18n="dashboard_account_details"
              >
                Account details
              </h2>
            </header>

            <div
              class="dashboard-details"
              id="dashboardDetails"
            ></div>
          </section>

          <aside
            class="dashboard-section dashboard-actions-section"
            aria-labelledby="availableActionsTitle"
          >
            <header class="dashboard-section-heading">
              <h2
                id="availableActionsTitle"
                data-i18n="dashboard_available_actions"
              >
                Available actions
              </h2>
            </header>

            <nav
              class="dashboard-actions"
              id="dashboardActions"
              aria-label="Account actions"
            ></nav>
          </aside>

          <section
            class="dashboard-section dashboard-mfa-section"
            aria-labelledby="mfaTitle"
          >
            <header class="dashboard-section-heading">
              <h2 id="mfaTitle">Multi-factor authentication</h2>
            </header>

            <div
              class="dashboard-mfa-grid"
              id="mfa-config"
            >
              <div class="mfa-panel">
                <h3>TOTP</h3>

                <div class="mfa-actions">
                  <button
                    class="mfa-button mfa-button-primary"
                    id="totp-setup"
                    type="button"
                  >
                    Setup TOTP
                  </button>
                </div>

                <div
                  class="mfa-output"
                  id="totp-otpauth"
                  aria-live="polite"
                ></div>

                <div class="mfa-verification-row">
                  <label class="mfa-field">
                    <span>Authenticator code</span>
                    <input
                      id="totp-code"
                      inputmode="numeric"
                      autocomplete="one-time-code"
                      placeholder="000000"
                    />
                  </label>

                  <button
                    class="mfa-button"
                    id="totp-verify"
                    type="button"
                  >
                    Verify
                  </button>
                </div>

                <div
                  class="totp-manager"
                  aria-labelledby="totpStatusTitle"
                >
                  <div class="passkey-manager-heading">
                    <h4 id="totpStatusTitle">
                      Authenticator app status
                    </h4>

                    <button
                      class="mfa-link-button"
                      id="totp-refresh"
                      type="button"
                    >
                      Refresh
                    </button>
                  </div>

                  <div
                    class="totp-status"
                    id="totp-status"
                    aria-live="polite"
                  ></div>
                </div>
              </div>

              <div class="mfa-panel">
                <h3>Passkey</h3>

                <div class="mfa-actions">
                  <button
                    class="mfa-button mfa-button-primary"
                    id="webauthn-register"
                    type="button"
                  >
                    Register Passkey
                  </button>

                  <button
                    class="mfa-button"
                    id="webauthn-authenticate"
                    type="button"
                  >
                    Authenticate
                  </button>
                </div>

                <div
                  class="passkey-manager"
                  aria-labelledby="passkeyListTitle"
                >
                  <div class="passkey-manager-heading">
                    <h4 id="passkeyListTitle">
                      Registered passkeys
                    </h4>

                    <button
                      class="mfa-link-button"
                      id="passkey-refresh"
                      type="button"
                    >
                      Refresh
                    </button>
                  </div>

                  <div
                    class="passkey-list"
                    id="passkey-list"
                    aria-live="polite"
                  ></div>
                </div>
              </div>
            </div>
          </section>
        </div>
      </section>
    </main>

    <footer id="footer"></footer>

    <script src="/index.js"></script>
    <script src="/translations.js"></script>
    <script src="/dashboard.js"></script>
    <script src="/dashboard-mfa.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title data-i18n="dashboard_page_title">
      Account Dashboard | CMCEN / RCMCE
    </title>

    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <header id="header"></header>

    <main class="dashboard-main">
      <section
        class="dashboard-shell"
        aria-labelledby="dashboardTitle"
      >
        <header class="dashboard-heading">
          <div class="dashboard-heading-copy">
            <p
              class="dashboard-eyebrow"
              data-i18n="dashboard_member_account"
            >
              Member account
            </p>

            <h1
              id="dashboardTitle"
              data-i18n="dashboard_title"
            >
              Account Dashboard
            </h1>

            <p
              class="dashboard-member-name"
              id="dashboardMemberName"
            >
              Loading...
            </p>
          </div>

          <span
            class="dashboard-role-badge"
            id="dashboardRoleBadge"
            hidden
          ></span>
        </header>

        <div
          class="dashboard-status"
          id="dashboardStatus"
          aria-live="polite"
        >
          <p data-i18n="loading_text">
            Loading...
          </p>
        </div>

        <div
          class="dashboard-content"
          id="dashboardContent"
          hidden
        >
          <section
            class="dashboard-section"
            aria-labelledby="accountDetailsTitle"
          >
            <header class="dashboard-section-heading">
              <h2
                id="accountDetailsTitle"
                data-i18n="dashboard_account_details"
              >
                Account details
              </h2>
            </header>

            <div
              class="dashboard-details"
              id="dashboardDetails"
            ></div>
          </section>

          <aside
            class="dashboard-section dashboard-actions-section"
            aria-labelledby="availableActionsTitle"
          >
            <header class="dashboard-section-heading">
              <h2
                id="availableActionsTitle"
                data-i18n="dashboard_available_actions"
              >
                Available actions
              </h2>
            </header>

            <nav
              class="dashboard-actions"
              id="dashboardActions"
              aria-label="Account actions"
            ></nav>
          </aside>
        </div>

        <footer
          class="dashboard-access"
          id="dashboardAccess"
          hidden
        >
          <span
            class="dashboard-access-label"
            data-i18n="access_level"
          >
            Access level
          </span>

          <div class="dashboard-access-copy">
            <strong id="dashboardAccessTitle"></strong>

            <p id="dashboardAccessDescription"></p>
          </div>
        </footer>
      </section>
    </main>

    <footer id="footer"></footer>

    <script src="/index.js"></script>
    <script src="/translations.js"></script>
    <script src="/dashboard.js"></script>
  </body>
</html>

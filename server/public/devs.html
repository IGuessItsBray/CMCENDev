<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CMCEN Developers</title>
    <link
      rel="icon"
      type="image/png"
      href="https://cdn.corebot.ca/cmcen-demo/favicon_crest.png"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header id="header"></header>

    <main class="about-family-main">
      <article class="about-family-shell" aria-labelledby="developersTitle">
        <header class="about-family-hero">
          <div class="about-family-hero-copy">
            <h1 id="developersTitle">CMCEN Developers</h1>
            <p class="about-family-tagline">
              Made with <span aria-label="love">♥</span>
            </p>
          </div>

          <img
            src="/images/logo.png"
            alt=""
            class="about-family-emblem"
            aria-hidden="true"
          />
        </header>

        <div class="about-family-body">
          <section class="about-family-section" aria-label="Development team">
            <ul class="about-family-pillar-list developers-team-list">
              <li><strong>Bray</strong> — Lead Developer, Infrastructure</li>
              <li><strong>Eric</strong> — Lead Developer, Frontend</li>
              <li><strong>Terry</strong> — Project Manager</li>
            </ul>
          </section>
        </div>
      </article>
    </main>

    <footer id="footer"></footer>

    <script src="/app-utils.js"></script>
    <script src="/timers.js"></script>
    <script src="/index.js"></script>
    <script src="/translations.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>History &amp; Heritage | CMCEN / RCMCE</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/history-heritage.css" />
  </head>
  <body>
    <header id="header"></header>
    <main class="news-main heritage-main">
      <section class="news-shell">
        <header class="news-heading">
          <p class="news-eyebrow" id="heritageEyebrow">C&amp;E Branch</p>
          <h1 id="heritageHeading">History &amp; Heritage</h1>
          <p id="heritageIntro">
            Discover the people, places, and moments that shaped our C&amp;E
            heritage.
          </p>
        </header>
        <p
          class="news-message"
          id="heritageMessage"
          role="status"
          aria-live="polite"
        ></p>
        <section
          class="news-grid"
          id="heritageList"
          aria-label="History and heritage"
        ></section>
        <button class="heritage-more" id="heritageMore" type="button" hidden>
          Load more
        </button>
      </section>
    </main>
    <footer id="footer"></footer>
    <script src="/app-utils.js"></script>
    <script src="/timers.js"></script>
    <script src="/index.js"></script>
    <script src="/translations.js"></script>
    <script src="/history-heritage.js"></script>
  </body>
</html>

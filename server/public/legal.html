<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Legal | CMCEN / RCMCE</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header id="header"></header>

    <main class="legal-document-main" id="mainContent">
      <article
        class="legal-document"
        id="legalDocument"
        aria-live="polite"

          <span class="loading-state-spinner" aria-hidden="true"></span>
          <span data-i18n="legal_document_loading">Loading document…</span>
        </div>
      </article>
    </main>

    <footer id="footer"></footer>

    <script src="/app-utils.js"></script>
    <script src="/timers.js"></script>
    <script src="/index.js"></script>
    <script src="/translations.js"></script>
    <script src="/legal.js"></script>
  </body>
</html>

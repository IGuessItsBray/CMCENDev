<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header id="header"></header>
    <main class="auth-main">
      <div class="auth-card">
        <h2 data-i18n="login_title">Login</h2>
        <p class="auth-error" id="loginError"></p>

        <div class="auth-field">
          <label data-i18n="username">Username</label>
          <input type="text" id="loginUsername" data-i18n-placeholder="username_placeholder"/>
        </div>
        <div class="auth-field">
          <label data-i18n="password">Password</label>
          <input type="password" id="loginPassword" data-i18n-placeholder="password_placeholder" />
        </div>

        <button class="auth-btn" id="loginBtn" data-i18n="login_btn">Login</button>
        <p class="auth-switch"><span data-i18n="no_account">Don't have an account?</span> <a href="register.html" data-i18n="register_title">Register</a></p>
      </div>
    </main>
    <footer id="footer"></footer>
    <script src="index.js"></script>
    <script>
      document.getElementById('loginBtn').addEventListener('click', async () => {
        const username = document.getElementById('loginUsername').value;
        const password = document.getElementById('loginPassword').value;
        const errorEl = document.getElementById('loginError');
        errorEl.textContent = '';

        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          const data = await res.json();

          if (!res.ok) throw new Error(data.error || 'Login failed');

          localStorage.setItem('token', data.token);
          window.location.href = '/index.html';
        } catch (err) {
          errorEl.textContent = err.message;
        }
      });
    </script>
    <script src="translations.js"></script>
  </body>
</html>

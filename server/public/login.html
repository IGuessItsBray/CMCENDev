<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title data-i18n="login_page_title">
      Member Login | CMCEN / RCMCE
    </title>

    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <header id="header"></header>

    <main class="login-main">
      <section
        class="login-shell"
        aria-labelledby="loginTitle"
      >
        <div class="login-introduction">
          <div class="login-introduction-content">
          

<p class="login-eyebrow">
  CMCEN / RCMCE
</p>

<h1 data-i18n="member_login_heading">
  Member Access
</h1>

<p
  class="login-intro-copy"
  data-i18n="member_login_intro"
>
  For Association members, contributors and staff.
</p>

    
          </div>
        </div>

        <div class="login-panel">
          <div class="login-panel-heading">
            

            <h2
              id="loginTitle"
              data-i18n="login_title"
            >
              Sign in
            </h2>

            <p data-i18n="login_instruction">
              Enter your registered username and password.
            </p>
          </div>

          <form
            class="login-form"
            id="loginForm"
          >
            <p
              class="login-error"
              id="loginError"
              role="alert"
              aria-live="polite"
              hidden
            ></p>

            <div class="login-field">
              <label
                for="loginUsername"
                data-i18n="username"
              >
                Username
              </label>

              <input
                type="text"
                id="loginUsername"
                name="username"
                autocomplete="username"
                data-i18n-placeholder="username_placeholder"
                placeholder="Enter your username"
                required
              />
            </div>

            <div class="login-field">
              <label
                for="loginPassword"
                data-i18n="password"
              >
                Password
              </label>

              <input
                type="password"
                id="loginPassword"
                name="password"
                autocomplete="current-password"
                data-i18n-placeholder="password_placeholder"
                placeholder="Enter your password"
                required
              />
            </div>

            <button
              type="submit"
              class="login-submit"
              id="loginBtn"
              data-i18n="login_btn"
            >
              Sign in
            </button>

            <div class="login-assistance">
              <span data-i18n="account_help">
                Need help accessing your account?
              </span>

              <a
                href="/contact.html"
                data-i18n="menu_contact"
              >
                Contact us
              </a>
            </div>

            <div
              class="login-divider"
              aria-hidden="true"
            ></div>

            <p class="login-register">
              <span data-i18n="no_account">
                Don't have an account?
              </span>

              <a
                href="/register.html"
                data-i18n="register_title"
              >
                Register
              </a>
            </p>
          </form>
        </div>
      </section>
    </main>

    <footer id="footer"></footer>

    <script src="/index.js"></script>
    <script src="/translations.js"></script>

    <script>
      const loginForm =
        document.getElementById('loginForm');

      const loginButton =
        document.getElementById('loginBtn');

      const errorElement =
        document.getElementById('loginError');

      function setLoginMessage(message, type = 'error') {
        errorElement.textContent = message;
        errorElement.hidden = !message;
        errorElement.classList.toggle('is-info', type === 'info');
      }

      function normalizeToken(value) {
        return String(value || '').trim().replace(/^Bearer\s+/i, '');
      }

      function ensureWebAuthnAvailable() {
        if (!window.PublicKeyCredential || !navigator.credentials) {
          throw new Error(
            'Passkeys are not available in this browser context. Use HTTPS or localhost in a supported browser.'
          );
        }
      }

      function b64ToArrayBuffer(b64url) {
        const base64 = b64url.replace(/-/g, '+').replace(/_/g, '/');
        const padded = base64 + '='.repeat((4 - base64.length % 4) % 4);
        const binary = atob(padded);
        const bytes = new Uint8Array(binary.length);

        for (let index = 0; index < binary.length; index += 1) {
          bytes[index] = binary.charCodeAt(index);
        }

        return bytes.buffer;
      }

      function arrayBufferToBase64url(buffer) {
        const bytes = new Uint8Array(buffer);
        let binary = '';

        for (let index = 0; index < bytes.byteLength; index += 1) {
          binary += String.fromCharCode(bytes[index]);
        }

        return btoa(binary)
          .replace(/\+/g, '-')
          .replace(/\//g, '_')
          .replace(/=+$/, '');
      }

      async function passkeyMfaLogin(tempToken) {
        ensureWebAuthnAvailable();
        setLoginMessage(
          'Use your passkey to finish signing in.',
          'info'
        );

        const optionsResponse = await fetch(
          '/api/mfa/webauthn/authenticate/options',
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-temp-token': tempToken
            }
          }
        );

        const options = await optionsResponse
          .json()
          .catch(() => ({}));

        if (!optionsResponse.ok) {
          throw new Error(
            options.error || 'Could not start passkey authentication'
          );
        }

        if (
          !options.allowCredentials ||
          options.allowCredentials.length === 0
        ) {
          throw new Error('No passkeys are registered for this account.');
        }

        options.challenge = b64ToArrayBuffer(options.challenge);
        options.allowCredentials = options.allowCredentials.map(
          credential => ({
            ...credential,
            id: b64ToArrayBuffer(credential.id)
          })
        );

        const assertion = await navigator.credentials.get({
          publicKey: options
        });

        const payload = {
          id: assertion.id,
          rawId: arrayBufferToBase64url(assertion.rawId),
          type: assertion.type,
          response: {
            authenticatorData: arrayBufferToBase64url(
              assertion.response.authenticatorData
            ),
            clientDataJSON: arrayBufferToBase64url(
              assertion.response.clientDataJSON
            ),
            signature: arrayBufferToBase64url(
              assertion.response.signature
            ),
            userHandle: assertion.response.userHandle
              ? arrayBufferToBase64url(assertion.response.userHandle)
              : null
          }
        };

        const verifyResponse = await fetch(
          '/api/mfa/webauthn/authenticate/verify',
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-temp-token': tempToken
            },
            body: JSON.stringify(payload)
          }
        );

        const result = await verifyResponse
          .json()
          .catch(() => ({}));

        if (!verifyResponse.ok) {
          throw new Error(
            result.error || 'Passkey authentication failed'
          );
        }

        if (!result.token) {
          throw new Error('Login completed but no session token was returned');
        }

        const fullToken = normalizeToken(result.token);
        localStorage.setItem('token', fullToken);
        localStorage.setItem('api_token', fullToken);
        sessionStorage.removeItem('tempToken');
        sessionStorage.removeItem('twoFactorMethods');

        if (typeof window.refreshAuthUI === 'function') {
          window.refreshAuthUI();
        }
      }

      loginForm.addEventListener(
        'submit',
        async event => {
          event.preventDefault();

          const username = document
            .getElementById('loginUsername')
            .value
            .trim();

          const password =
            document.getElementById('loginPassword').value;

          setLoginMessage('');

          loginButton.disabled = true;
          loginButton.setAttribute('aria-busy', 'true');

          try {
            const response = await fetch('/api/login', {
              method: 'POST',

              headers: {
                'Content-Type': 'application/json'
              },

              body: JSON.stringify({
                username,
                password
              })
            });

            const data = await response
              .json()
              .catch(() => ({}));

            if (!response.ok) {
              throw new Error(
                data.error || 'Login failed'
              );
            }

            if (data.twoFactorRequired) {
              const methods = Array.isArray(data.methods)
                ? data.methods
                : [];

              sessionStorage.setItem(
                'tempToken',
                data.tempToken
              );

              sessionStorage.setItem(
                'twoFactorMethods',
                JSON.stringify(methods)
              );

              if (methods.includes('webauthn')) {
                await passkeyMfaLogin(data.tempToken);
                window.location.href = '/dashboard.html';
                return;
              }

              window.location.href = '/mfa.html';
            } else {
              const fullToken = normalizeToken(data.token);
              localStorage.setItem('token', fullToken);
              localStorage.setItem('api_token', fullToken);

              if (typeof window.refreshAuthUI === 'function') {
                window.refreshAuthUI();
              }

              window.location.href = '/dashboard.html';
            }
          } catch (error) {
            setLoginMessage(error.message);
          } finally {
            loginButton.disabled = false;

            loginButton.removeAttribute(
              'aria-busy'
            );
          }
        }
      );
    </script>
  </body>
</html>

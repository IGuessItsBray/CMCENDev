<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>MFA Setup</title>
</head>
<body>
  <h1>MFA & Passkey Demo</h1>
  <p>Paste JWT token from /api/login when prompted.</p>

  <section>
    <h2>TOTP</h2>
    <button id="totp-setup">Setup TOTP</button>
    <div id="totp-otpauth"></div>
    <input id="totp-code" placeholder="Enter TOTP code">
    <button id="totp-verify">Verify TOTP</button>
  </section>

  <section>
    <h2>Passkey (WebAuthn)</h2>
    <button id="webauthn-register">Register Passkey</button>
    <button id="webauthn-authenticate">Authenticate with Passkey</button>
  </section>

  <script src="/mfa.js"></script>
</body>
</html>

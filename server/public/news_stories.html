<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>News Stories | CMCEN / RCMCE</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header id="header"></header>
    <main class="news-main">
      <section class="news-shell">
        <header class="news-heading">
          <p class="news-eyebrow" data-i18n="news_listing_eyebrow">
            News &amp; events
          </p>
          <h1 data-i18n="news_listing_heading">News Stories</h1>
          <p data-i18n="news_listing_intro">
            Updates, stories, and announcements from across the C&amp;E Family.
          </p>
        </header>

        <p
          class="news-message"
          id="newsPageMessage"
          role="status"
          aria-live="polite"
        >
          <span data-i18n="news_listing_loading">Loading news stories...</span>
        </p>
        <section
          class="news-grid"
          id="newsStoriesList"
          aria-label="Published news stories"
          data-i18n-aria-label="news_listing_aria_label"
        ></section>
      </section>
    </main>
    <footer id="footer"></footer>
    <script src="/app-utils.js"></script>
    <script src="/timers.js"></script>
    <script src="/index.js"></script>
    <script src="/translations.js"></script>
    <script src="/news-stories.js"></script>
  </body>
</html>

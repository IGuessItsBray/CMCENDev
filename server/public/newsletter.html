<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Article | CMCEN / RCMCE</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/newsletter.css" />
  </head>
  <body>
    <header id="header"></header>
    <div
      id="newsletterPreviewBanner"
      class="site-timers site-timers-below-header"
      hidden
    >
      <aside class="site-timer" data-icon="info" role="status">
        <div class="site-timer-track">
          <span class="site-timer-accent" aria-hidden="true">i</span>
          <span class="site-timer-text">
            <span id="newsletterPreviewText" class="site-timer-message"></span>
          </span>
        </div>
      </aside>
    </div>
    <main id="mainContent" class="about-family-main newsletter-main">
      <aside
        id="newsletterContext"
        class="newsletter-page-context"
        role="note"
        hidden
      >
        <span class="newsletter-context-icon" aria-hidden="true">i</span>
        <p id="newsletterContextText"></p>
      </aside>
      <article
        id="newsletterArticle"
        class="about-family-shell"
        aria-busy="true"
      >
        <p class="newsletter-status" role="status" data-i18n="article_loading">
          Loading article…
        </p>
      </article>
      <section
        id="newsletterStaffActions"
        class="article-staff-actions"
        aria-labelledby="newsletterStaffLabel"
        hidden
      >
        <h2 class="article-staff-actions-label" id="newsletterStaffLabel"></h2>
        <a id="newsletterStaffEdit" class="article-staff-actions-link"></a>
      </section>
      <noscript
        >This article requires JavaScript.
        <a href="/news_stories">Browse articles</a>.</noscript
      >
    </main>
    <footer id="footer"></footer>
    <script src="/app-utils.js"></script>
    <script src="/timers.js"></script>
    <script src="/index.js"></script>
    <script src="/translations.js"></script>
    <script src="/newsletter-format.js"></script>
    <script src="/newsletter.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title data-i18n="notifications_page_title">
      Notifications | CMCEN / RCMCE
    </title>
    <link
      rel="icon"
      type="image/png"
      href="https://cdn.corebot.ca/cmcen-demo/favicon_crest.png"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <header id="header"></header>

    <main class="notifications-main">
      <section class="notifications-shell" aria-labelledby="notificationsTitle">
        <header class="notifications-heading">
          <p class="dashboard-eyebrow" data-i18n="notifications_eyebrow">
            Account notifications
          </p>

          <h1 id="notificationsTitle" data-i18n="notifications_heading">
            Notifications
          </h1>

          <p data-i18n="notifications_intro">
            Review rejected submissions and open them for correction.
          </p>
        </header>

        <p
          class="notifications-status is-loading"
          id="notificationsStatus"
          role="status"
          aria-live="polite"
          aria-label="Loading notifications..."
        >
          <span class="loading-state-spinner" aria-hidden="true"></span>
          <span class="visually-hidden" data-i18n="notifications_loading">
            Loading notifications...
          </span>
        </p>

        <div class="notifications-list" id="notificationsList" hidden></div>
      </section>
    </main>

    <footer id="footer"></footer>

    <script src="/app-utils.js"></script>
    <script src="/timers.js"></script>
    <script src="/index.js"></script>
    <script src="/translations.js"></script>
    <script src="/notifications.js"></script>
  </body>
</html>

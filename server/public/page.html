<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Page | CMCEN / RCMCE</title>
    <link rel="icon" type="image/png" href="https://cdn.corebot.ca/cmcen-demo/favicon_crest.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <header id="header"></header>

    <main class="dashboard-main cms-page-main">
      <article
        class="cms-page"
        id="cmsPage"
        aria-live="polite"
      >

          <span class="loading-state-spinner" aria-hidden="true"></span>
          <span class="visually-hidden">Loading...</span>
        </div>
      </article>
    </main>

    <footer id="footer"></footer>

    <script src="/app-utils.js"></script>
    <script src="/timers.js"></script>
    <script src="/index.js"></script>
    <script src="/translations.js"></script>
    <script src="/page.js"></script>
  </body>
</html>

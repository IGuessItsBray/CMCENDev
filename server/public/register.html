<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title data-i18n="register_page_title">
      Register | CMCEN / RCMCE
    </title>

    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <header id="header"></header>

    <main class="register-main">
      <section
        class="app-shell register-shell"
        aria-labelledby="registerTitle"
      >
        <header class="app-page-header">

          <div class="app-page-header-copy">
            <p
              class="app-eyebrow"
              data-i18n="member_registration"
            >
              Member registration
            </p>

            <h1
              class="app-page-title"
              id="registerTitle"
              data-i18n="create_account"
            >
              Create an account
            </h1>
          </div>
        </header>

        <div class="register-panel">
          <form
            class="register-form"
            id="registerForm"
          >
            <p
              class="register-error"
              id="registerError"
              role="alert"
              aria-live="polite"
              hidden
            ></p>

            <div class="register-fields">
              <div class="register-field">
                <label
                  for="regFirstName"
                  data-i18n="first_name"
                >
                  First name
                </label>

                <input
                  type="text"
                  id="regFirstName"
                  name="firstName"
                  autocomplete="given-name"
                  required
                />
              </div>

              <div class="register-field">
                <label
                  for="regLastName"
                  data-i18n="last_name"
                >
                  Last name
                </label>

                <input
                  type="text"
                  id="regLastName"
                  name="lastName"
                  autocomplete="family-name"
                  required
                />
              </div>

              <div class="register-field register-field-wide">
                <label
                  for="regAddressLine1"
                  data-i18n="address_line_1"
                >
                  Address line 1
                </label>

                <input
                  type="text"
                  id="regAddressLine1"
                  name="addressLine1"
                  autocomplete="address-line1"
                  required
                />
              </div>

              <div class="register-field register-field-wide">
                <label
                  for="regAddressLine2"
                  data-i18n="address_line_2"
                >
                  Address line 2
                </label>

                <input
                  type="text"
                  id="regAddressLine2"
                  name="addressLine2"
                  autocomplete="address-line2"
                />
              </div>

              <div class="register-field">
                <label
                  for="regCity"
                  data-i18n="city"
                >
                  City
                </label>

                <input
                  type="text"
                  id="regCity"
                  name="city"
                  autocomplete="address-level2"
                  required
                />
              </div>

              <div class="register-field">
                <label
                  for="regCountry"
                  data-i18n="country"
                >
                  Country
                </label>

                <input
                  type="text"
                  id="regCountry"
                  name="country"
                  autocomplete="country-name"
                  required
                />
              </div>

              <div class="register-field">
                <label
                  for="regStateProvince"
                  data-i18n="state_province"
                >
                  State/province
                </label>

                <input
                  type="text"
                  id="regStateProvince"
                  name="stateProvince"
                  autocomplete="address-level1"
                  required
                />
              </div>

              <div class="register-field">
                <label
                  for="regPostalCode"
                  data-i18n="postal_code"
                >
                  Zip/postal code
                </label>

                <input
                  type="text"
                  id="regPostalCode"
                  name="postalCode"
                  autocomplete="postal-code"
                  required
                />
              </div>

              <div class="register-field">
                <label
                  for="regRank"
                  data-i18n="rank"
                >
                  Rank
                </label>

                <input
                  type="text"
                  id="regRank"
                  name="rank"
                />
              </div>

              <div class="register-field">
                <label
                  for="regPostNominals"
                  data-i18n="post_nominals"
                >
                  Post nominals
                </label>

                <input
                  type="text"
                  id="regPostNominals"
                  name="postNominals"
                />
              </div>

              <div class="register-field">
                <label
                  for="regCompany"
                  data-i18n="company"
                >
                  Company
                </label>

                <input
                  type="text"
                  id="regCompany"
                  name="company"
                  autocomplete="organization"
                />
              </div>

              <div class="register-field">
                <label
                  for="regStatus"
                  data-i18n="status"
                >
                  Status
                </label>

                <select
                  id="regStatus"
                  name="status"
                  required
                >
                  <option value="" selected disabled data-i18n="select_option">
                    Select an option
                  </option>

                  <option value="regular" data-i18n="status_regular">
                    Regular
                  </option>

                  <option value="reserve" data-i18n="status_reserve">
                    Reserve
                  </option>

                  <option value="honourary" data-i18n="status_honourary">
                    Honourary
                  </option>

                  <option value="civilian" data-i18n="status_civilian">
                    Civilian
                  </option>

                  <option value="retired" data-i18n="status_retired">
                    Retired
                  </option>

                  <option value="released" data-i18n="status_released">
                    Released
                  </option>

                  <option value="other" data-i18n="status_other">
                    Other
                  </option>
                </select>
              </div>

              <div class="register-field">
                <label
                  for="regAffiliationElement"
                  data-i18n="affiliation_element"
                >
                  Affiliation/element
                </label>

                <select
                  id="regAffiliationElement"
                  name="affiliationElement"
                  required
                >
                  <option value="" selected disabled data-i18n="select_option">
                    Select an option
                  </option>

                  <option value="army" data-i18n="element_army">
                    Army
                  </option>

                  <option value="navy" data-i18n="element_navy">
                    Navy
                  </option>

                  <option value="air_force" data-i18n="element_air_force">
                    Air Force
                  </option>

                  <option value="other" data-i18n="element_other">
                    Other
                  </option>
                </select>
              </div>

              <div class="register-field">
                <label
                  for="regTrade"
                  data-i18n="trade"
                >
                  MOSID/MOC/Trade
                </label>

                <select
                  id="regTrade"
                  name="trade"
                >
                  <option value="" selected data-i18n="select_option">
                    Select an option
                  </option>
                </select>
              </div>

              <div
                class="register-field"
                id="regTradeOtherField"
                hidden
              >
                <label
                  for="regTradeOther"
                  data-i18n="trade_other"
                >
                  MOSID/MOC/Trade (Other)
                </label>

                <input
                  type="text"
                  id="regTradeOther"
                  name="tradeOther"
                  disabled
                />
              </div>

              <div class="register-field register-field-wide">
                <label
                  for="regCurrentUnit"
                  data-i18n="current_unit"
                >
                  Current unit
                </label>

                <input
                  type="text"
                  id="regCurrentUnit"
                  name="currentUnit"
                  autocomplete="organization"
                />
              </div>

              <div class="register-field">
                <label
                  for="regPreferredLanguage"
                  data-i18n="preferred_language"
                >
                  Preferred language
                </label>

                <select
                  id="regPreferredLanguage"
                  name="preferredLanguage"
                  required
                >
                  <option value="en" data-i18n="language_en">
                    English
                  </option>

                  <option value="fr" data-i18n="language_fr">
                    French
                  </option>
                </select>
              </div>

              <div class="register-field register-field-wide">
                <label
                  for="regEmail"
                  data-i18n="email"
                >
                  Email
                </label>

                <input
                  type="email"
                  id="regEmail"
                  name="email"
                  autocomplete="email"
                  data-i18n-placeholder="email_placeholder"
                  placeholder="Enter your email"
                  required
                />
              </div>

              <div class="register-field">
                <label
                  for="regPassword"
                  data-i18n="password"
                >
                  Password
                </label>

                <input
                  type="password"
                  id="regPassword"
                  name="password"
                  autocomplete="new-password"
                  data-i18n-placeholder="password_create_placeholder"
                  placeholder="Create a password"
                  required
                />
              </div>

              <div class="register-field">
                <label
                  for="regPasswordConfirmation"
                  data-i18n="password_confirmation"
                >
                  Password confirmation
                </label>

                <input
                  type="password"
                  id="regPasswordConfirmation"
                  name="passwordConfirmation"
                  autocomplete="new-password"
                  data-i18n-placeholder="password_confirm_placeholder"
                  placeholder="Confirm your password"
                  required
                />

                <div
                  class="password-strength"
                  id="passwordStrength"
                  aria-hidden="true"
                >
                  <span></span>
                </div>
              </div>
            </div>

            <div class="register-actions">
              <button
                type="submit"
                class="app-button is-primary is-large is-block register-submit"
                id="registerBtn"
                data-i18n="register_btn"
              >
                Create account
              </button>

              <p class="register-switch">
                <span data-i18n="have_account">
                  Already have an account?
                </span>

                <a
                  href="/login.html"
                  data-i18n="login_title"
                >
                  Sign in
                </a>
              </p>
            </div>
          </form>

          <section
            class="register-mfa"
            id="registerMfa"
            aria-labelledby="registerMfaTitle"
            hidden
          >
            <div class="register-mfa-heading">
              <p class="app-eyebrow">
                Account security
              </p>

              <h2 id="registerMfaTitle">
                Choose your multi-factor method
              </h2>
            </div>

            <p
              class="register-error"
              id="registerMfaError"
              role="alert"
              aria-live="polite"
              hidden
            ></p>

            <div
              class="register-mfa-options"
              id="registerMfaOptions"
            >
              <button
                class="register-mfa-option is-recommended"
                id="registerPasskeyOption"
                type="button"
              >
                <span class="register-mfa-option-label">
                  Passkey
                </span>

                <span class="register-mfa-recommended">
                  Recommended
                </span>

                <span class="register-mfa-option-copy">
                  Use your device fingerprint, face unlock, PIN, or security key.
                </span>
              </button>

              <button
                class="register-mfa-option"
                id="registerTotpOption"
                type="button"
              >
                <span class="register-mfa-option-label">
                  Authenticator app
                </span>

                <span class="register-mfa-option-copy">
                  Use a six-digit code from an app such as Microsoft Authenticator, Google Authenticator, or 1Password.
                </span>
              </button>
            </div>

            <div
              class="register-totp-setup"
              id="registerTotpSetup"
              hidden
            >
              <div
                class="mfa-output"
                id="registerTotpOutput"
                aria-live="polite"
              ></div>

              <div class="mfa-verification-row">
                <label class="mfa-field">
                  <span>Authenticator code</span>

                  <input
                    id="registerTotpCode"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    placeholder="000000"
                  />
                </label>

                <button
                  class="app-button is-primary mfa-button"
                  id="registerTotpVerify"
                  type="button"
                >
                  Verify
                </button>
              </div>
            </div>
          </section>
        </div>
      </section>
    </main>

    <footer id="footer"></footer>

    <script src="/app-utils.js"></script>
    <script src="/index.js"></script>
    <script src="/translations.js"></script>
    <script src="/validation-i18n.js"></script>
    <script src="/trade-options.js"></script>
    <script src="/register.js"></script>
  </body>
</html>

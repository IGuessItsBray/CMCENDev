<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title data-i18n="register_page_title">
      Register | CMCEN / RCMCE
    </title>

    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <header id="header"></header>

    <main class="register-main">
      <section
        class="register-shell"
        aria-labelledby="registerTitle"
      >
        <header class="register-heading">
          <div
            class="register-standard"
            aria-hidden="true"
          >
            <span class="register-standard-grey"></span>
            <span class="register-standard-navy"></span>
          </div>

          <div>
            <p
              class="register-eyebrow"
              data-i18n="member_registration"
            >
              Member registration
            </p>

            <h1
              id="registerTitle"
              data-i18n="create_account"
            >
              Create an account
            </h1>
          </div>
        </header>

        <div class="register-panel">
          <form
            class="register-form"
            id="registerForm"
          >
            <p
              class="register-error"
              id="registerError"
              role="alert"
              aria-live="polite"
              hidden
            ></p>

            <div class="register-fields">
              <div class="register-field">
                <label
                  for="regUsername"
                  data-i18n="username"
                >
                  Username
                </label>

                <input
                  type="text"
                  id="regUsername"
                  name="username"
                  autocomplete="username"
                  data-i18n-placeholder="username_placeholder"
                  placeholder="Enter your username"
                  required
                />
              </div>

              <div class="register-field">
                <label
                  for="regEmail"
                  data-i18n="email"
                >
                  Email
                </label>

                <input
                  type="email"
                  id="regEmail"
                  name="email"
                  autocomplete="email"
                  data-i18n-placeholder="email_placeholder"
                  placeholder="Enter your email"
                  required
                />
              </div>

              <div class="register-field">
                <label
                  for="regAccountName"
                  data-i18n="account_name"
                >
                  Account name
                </label>

                <input
                  type="text"
                  id="regAccountName"
                  name="accountName"
                  autocomplete="name"
                  data-i18n-placeholder="account_name_placeholder"
                  placeholder="Enter your name"
                  required
                />
              </div>

              <div class="register-field">
                <label
                  for="regPassword"
                  data-i18n="password"
                >
                  Password
                </label>

                <input
                  type="password"
                  id="regPassword"
                  name="password"
                  autocomplete="new-password"
                  data-i18n-placeholder="password_create_placeholder"
                  placeholder="Create a password"
                  required
                />
              </div>
            </div>

            <div class="register-actions">
              <button
                type="submit"
                class="register-submit"
                id="registerBtn"
                data-i18n="register_btn"
              >
                Create account
              </button>

              <p class="register-switch">
                <span data-i18n="have_account">
                  Already have an account?
                </span>

                <a
                  href="/login.html"
                  data-i18n="login_title"
                >
                  Sign in
                </a>
              </p>
            </div>
          </form>
        </div>
      </section>
    </main>

    <footer id="footer"></footer>

    <script src="/index.js"></script>
    <script src="/translations.js"></script>
    <script src="/register.js"></script>
  </body>
</html>

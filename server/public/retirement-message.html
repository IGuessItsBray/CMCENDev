<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title data-i18n="retirement_detail_page_title">
      Retirement Message | CMCEN / RCMCE
    </title>
    <link rel="icon" type="image/png" href="/images/favicon_crest.png" />
    <link rel="stylesheet" href="/styles.css?v=retirement-photo-raw-v1" />
    <link rel="stylesheet" href="/body-content.css" />
  </head>

  <body>
    <header id="header"></header>
    <div
      id="retirementPreviewNotice"
      class="site-timers site-timers-below-header"
      hidden
    >
      <aside class="site-timer" data-icon="info" role="status">
        <div class="site-timer-track">
          <span class="site-timer-accent" aria-hidden="true">i</span>
          <span class="site-timer-text">
            <span class="site-timer-message" data-i18n="article_preview_notice">
              Staff preview — this is not the public article.
            </span>
          </span>
        </div>
      </aside>
    </div>

    <main class="retirement-detail-main">
      <article
        class="retirement-detail-shell"
        aria-labelledby="retirementDetailTitle"
      >
        <p
          class="retirements-message is-loading"
          id="retirementDetailMessage"
          role="status"
          aria-live="polite"
          aria-label="Loading retirement message..."
        >
          <span class="loading-state-spinner" aria-hidden="true"></span>
          <span class="visually-hidden"> Loading retirement message... </span>
        </p>

        <div id="retirementDetailContent" hidden>
          <header class="retirement-detail-heading">
            <a class="retirement-detail-back" href="/retirements">
              <span aria-hidden="true">←</span>
              <span data-i18n="retirement_detail_back">
                Back to retirement messages
              </span>
            </a>

            <h1 id="retirementDetailTitle"></h1>

            <p class="retirement-detail-mosid" id="retirementDetailMosid"></p>

            <p class="retirement-detail-date" id="retirementDetailDate"></p>
          </header>

          <div class="retirement-detail-body">
            <figure class="retirement-detail-photo">
              <div id="retirementDetailPhoto"></div>
            </figure>

            <section
              class="retirement-detail-message-section"
              aria-label="Retirement message"
              data-i18n-aria-label="retirement_detail_message_label"
            >
              <div id="retirementDetailText"></div>
            </section>

            <section
              id="retirementCommentsSection"
              class="retirement-detail-comments"
              aria-labelledby="retirementCommentsHeading"
            >
              <h2
                id="retirementCommentsHeading"
                data-i18n="retirement_comments_heading"
              >
                Comments
              </h2>

              <p
                class="retirement-comment-message"
                id="retirementCommentMessage"
                role="status"
                aria-live="polite"
                hidden
              ></p>

              <div
                class="retirement-comment-list"
                id="retirementCommentList"
              ></div>

              <form
                class="retirement-comment-form"
                id="retirementCommentForm"
                novalidate
                hidden
              >
                <p
                  class="retirement-comment-edit-context"
                  id="retirementCommentEditContext"
                  hidden
                ></p>

                <label
                  for="retirementCommentText"
                  id="retirementCommentLabel"
                  data-i18n="retirement_comment_add"
                >
                  Add a comment
                </label>

                <textarea
                  id="retirementCommentText"
                  name="body"
                  rows="4"
                  minlength="2"
                  maxlength="10000"
                  data-character-counter
                  required
                ></textarea>

                <div class="retirement-comment-form-footer">
                  <small data-i18n="retirement_comment_review_note">
                    Comments may be reviewed before publication.
                  </small>

                  <div class="retirement-comment-form-actions">
                    <a
                      class="retirement-comment-cancel"
                      id="retirementCommentCancel"
                      href="/retirements"
                      data-i18n="retirement_comment_cancel_edit"
                      hidden
                    >
                      Cancel editing
                    </a>

                    <button
                      id="retirementCommentSubmit"
                      type="submit"
                      data-i18n="retirement_comment_post"
                    >
                      Post comment
                    </button>
                  </div>
                </div>
              </form>

              <p
                class="retirement-comment-login"
                id="retirementCommentLogin"
                hidden
              >
                <a href="/login" data-i18n="retirement_comment_login_prefix"
                  >Sign in</a
                >
                <span data-i18n="retirement_comment_login_suffix">
                  to add a comment.
                </span>
              </p>
            </section>
          </div>
        </div>
      </article>
      <section
        id="retirementStaffActions"
        class="article-staff-actions"
        aria-labelledby="retirementStaffLabel"
        hidden
      >
        <h2 class="article-staff-actions-label" id="retirementStaffLabel"></h2>
        <a id="retirementStaffEdit" class="article-staff-actions-link"></a>
      </section>
    </main>

    <footer id="footer"></footer>

    <script src="/app-utils.js"></script>
    <script src="/body-content.js"></script>
    <script src="/timers.js"></script>
    <script src="/index.js"></script>
    <script src="/translations.js"></script>
    <script src="/validation-i18n.js"></script>
    <script src="/retirement-message.js"></script>
  </body>
</html>

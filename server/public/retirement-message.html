<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title data-i18n="retirement_detail_page_title">
    Retirement Message | CMCEN / RCMCE
  </title>

  <link rel="stylesheet" href="/styles.css" />
</head>

<body>
  <header id="header"></header>

  <main class="retirement-detail-main">
    <article class="retirement-detail-shell" aria-labelledby="retirementDetailTitle">
      <p class="app-status is-loading is-large retirements-message" id="retirementDetailMessage" role="status" aria-live="polite"
        aria-label="Loading retirement message...">
        <span class="loading-state-spinner" aria-hidden="true"></span>
        <span class="visually-hidden">
          Loading retirement message...
        </span>
      </p>

      <div id="retirementDetailContent" hidden>
        <header class="retirement-detail-heading">
          <a class="retirement-detail-back" href="/retirements.html">
            <span aria-hidden="true">←</span>
            <span data-i18n="retirement_detail_back">
              Back to retirement messages
            </span>
          </a>

          <h1 id="retirementDetailTitle"></h1>

          <p class="retirement-detail-mosid" id="retirementDetailMosid"></p>

          <p class="retirement-detail-date" id="retirementDetailDate"></p>
        </header>

        <div class="retirement-detail-body">
          <figure class="retirement-detail-photo">
            <div id="retirementDetailPhoto"></div>
          </figure>

          <section class="retirement-detail-message-section" aria-label="Retirement message"
            data-i18n-aria-label="retirement_detail_message_label">
            <p id="retirementDetailText"></p>
          </section>

          <section class="retirement-detail-comments" aria-labelledby="retirementCommentsHeading">
            <h2 id="retirementCommentsHeading" data-i18n="retirement_comments_heading">
              Comments
            </h2>

            <p class="app-status retirement-comment-message" id="retirementCommentMessage" role="status" aria-live="polite" hidden>
            </p>

            <div class="retirement-comment-list" id="retirementCommentList"></div>

            <form class="retirement-comment-form" id="retirementCommentForm" novalidate hidden>
              <label for="retirementCommentText" data-i18n="retirement_comment_add">
                Add a comment
              </label>

              <textarea class="app-control" id="retirementCommentText" name="body" rows="4" minlength="2"
                maxlength="2000" required></textarea>

              <div class="retirement-comment-form-footer">
                <small data-i18n="retirement_comment_review_note">
                  Comments may be reviewed before publication.
                </small>

                <button class="app-button is-primary is-small" id="retirementCommentSubmit" type="submit" data-i18n="retirement_comment_post">
                  Post comment
                </button>
              </div>
            </form>

            <p class="retirement-comment-login" id="retirementCommentLogin" hidden>
              <a href="/login.html" data-i18n="retirement_comment_login_prefix">Sign in</a>
              <span data-i18n="retirement_comment_login_suffix">
                to add a comment.
              </span>
            </p>
          </section>
        </div>
      </div>
    </article>
  </main>

  <footer id="footer"></footer>

  <script src="/app-utils.js"></script>
  <script src="/index.js"></script>
  <script src="/translations.js"></script>
  <script src="/validation-i18n.js"></script>
  <script src="/retirement-message.js"></script>
</body>

</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title data-i18n="retirements_page_title">
      Retirement Messages | CMCEN / RCMCE
    </title>
    <link
      rel="icon"
      type="image/png"
      href="https://cdn.corebot.ca/cmcen-demo/favicon_crest.png"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <header id="header"></header>

    <main class="retirements-main">
      <section class="retirements-shell" aria-labelledby="retirementsTitle">
        <header class="retirements-heading">
          <p class="retirements-eyebrow" data-i18n="retirements_heading">
            Retirement Messages
          </p>

          <h1 id="retirementsTitle" data-i18n="retirements_heading">
            Retirement Messages
          </h1>
        </header>

        <form class="retirements-filter" id="retirementsFilter" role="search">
          <div class="retirements-filter-field">
            <label for="retirementsSearch" data-i18n="retirements_search_label">
              Search the archive
            </label>
            <input
              type="search"
              id="retirementsSearch"
              name="q"
              maxlength="100"
              autocomplete="off"
              data-i18n-placeholder="retirements_search_placeholder"
              placeholder="Name, trade, or message"
            />
          </div>

          <div class="retirements-filter-field retirements-filter-year">
            <label for="retirementsYear" data-i18n="retirements_year_label">
              Retirement year
            </label>
            <input
              type="number"
              id="retirementsYear"
              name="year"
              inputmode="numeric"
              min="1900"
              max="9999"
              step="1"
              data-i18n-aria-label="retirements_year_label"
            />
          </div>

          <div class="retirements-filter-actions">
            <button type="submit" data-i18n="retirements_search_submit">
              Search
            </button>
            <button
              type="button"
              class="retirements-filter-clear"
              id="retirementsFilterClear"
              data-i18n="retirements_search_clear"
            >
              Clear filters
            </button>
          </div>
        </form>

        <p
          class="retirements-message is-loading"
          id="retirementsMessage"
          role="status"
          aria-live="polite"
          aria-label="Loading retirement messages..."
        >
          <span class="loading-state-spinner" aria-hidden="true"></span>
          <span class="visually-hidden"> Loading retirement messages... </span>
        </p>

        <div class="retirements-grid" id="retirementsGrid" hidden></div>

        <div class="retirements-load-more" id="retirementsLoadMore" hidden>
          <button
            type="button"
            id="retirementsLoadMoreButton"
            aria-controls="retirementsGrid"
          >
            <span
              id="retirementsLoadMoreLabel"
              data-i18n="retirements_load_more"
            >
              Load more retirement messages
            </span>
          </button>

          <p
            class="retirements-load-more-message"
            id="retirementsLoadMoreMessage"
            role="status"
            aria-live="polite"
            hidden
          ></p>
        </div>
      </section>
    </main>

    <footer id="footer"></footer>

    <script src="/app-utils.js"></script>
    <script src="/timers.js"></script>
    <script src="/index.js"></script>
    <script src="/translations.js"></script>
    <script src="/retirements.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Retirement Messages | CMCEN / RCMCE</title>

    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <header id="header"></header>

    <main class="retirements-main">
      <section
        class="retirements-shell"
        aria-labelledby="retirementsTitle"
      >
        <header class="retirements-heading">
          <p class="retirements-eyebrow">
            Retirement Messages
          </p>

          <h1 id="retirementsTitle">
            Retirement Messages
          </h1>
        </header>

        <p
          class="retirements-message"
          id="retirementsMessage"
          role="status"
          aria-live="polite"
        >
          Loading retirement messages...
        </p>

        <div
          class="retirements-grid"
          id="retirementsGrid"
          hidden
        ></div>
      </section>
    </main>

    <footer id="footer"></footer>

    <script src="/index.js"></script>
    <script src="/translations.js"></script>
    <script src="/retirements.js"></script>
  </body>
</html>

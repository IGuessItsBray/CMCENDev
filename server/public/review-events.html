<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title data-i18n="review_events_title">
        Review Events
    </title>

    <link rel="stylesheet" href="/styles.css" />
</head>

<body>
    <header id="header"></header>

    <main class="review-main">
        <section class="review-container">
            <div class="review-heading">
                <h1 data-i18n="review_events_title">
                    Review Events
                </h1>

                <p data-i18n="review_events_intro">
                    Review pending event submissions.
                </p>
            </div>

            <p id="reviewPageMessage" class="calendar-message" data-i18n="loading_events">
                Loading events...
            </p>

            <div id="reviewQueue" hidden></div>
        </section>
    </main>

    <footer id="footer"></footer>

    <script src="/index.js"></script>
    <script src="/translations.js"></script>
    <script src="/review-events.js"></script>
</body>

</html>

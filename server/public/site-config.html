<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title data-i18n="site_config_page_title">
      Site Config | CMCEN / RCMCE
    </title>
    <link rel="icon" type="image/png" href="https://cdn.corebot.ca/cmcen-demo/favicon_crest.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <header id="header"></header>

    <main class="dashboard-main">
      <section
        class="dashboard-shell admin-work-zone-dashboard-shell"
        aria-labelledby="siteConfigTitle"
      >
        <header class="dashboard-heading">
          <div class="dashboard-heading-copy">
            <p
              class="dashboard-eyebrow"
              data-i18n="site_config_eyebrow"
            >
              Developer
            </p>

            <h1
              id="siteConfigTitle"
              data-i18n="site_config_heading"
            >
              Site config
            </h1>

            <p
              class="dashboard-member-name"
              data-i18n="site_config_intro"
            >
              Review and update environment-backed site configuration.
            </p>
          </div>
        </header>

        <nav
          class="admin-work-zone-tabs admin-work-zone-page-tabs"
          id="adminWorkZoneTabs"
          aria-label="Admin work zone views"
          data-i18n-aria-label="admin_work_zone_tabs_label"
        ></nav>

        <div
          class="dashboard-status is-loading"
          id="siteConfigStatus"
          role="status"
          aria-live="polite"
          aria-label="Loading..."
          data-i18n-aria-label="loading_text"
        >
          <span class="loading-state-spinner" aria-hidden="true"></span>
          <span class="visually-hidden" data-i18n="loading_text">Loading...</span>
        </div>

        <section
          class="dashboard-section admin-work-zone-page site-config-page"
          id="siteConfigPage"
          hidden
        >
          <div
            class="site-config-content"
            id="siteConfigContent"
          ></div>
        </section>
      </section>
    </main>

    <footer id="footer"></footer>

    <script src="/app-utils.js"></script>
    <script src="/index.js"></script>
    <script src="/translations.js"></script>
    <script src="/admin-work-zone-tabs.js"></script>
    <script src="/site-config.js"></script>
  </body>
</html>

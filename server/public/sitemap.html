<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Site map | CMCEN / RCMCE</title>
    <link
      rel="icon"
      type="image/png"
      href="https://cdn.corebot.ca/cmcen-demo/favicon_crest.png"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <header id="header"></header>

    <main class="sitemap-main">
      <section class="sitemap-shell" aria-labelledby="sitemapTitle">
        <header class="sitemap-heading">
          <p class="sitemap-eyebrow">Site map</p>

          <h1 id="sitemapTitle">CMCEN / RCMCE Site Map</h1>

          <p>
            Automatically generated from public site files and published pages.
          </p>
        </header>

        <p class="sitemap-status" id="sitemapStatus" aria-live="polite">
          Loading site map...
        </p>

        <div class="sitemap-grid" id="sitemapGrid"></div>
      </section>
    </main>

    <footer id="footer"></footer>

    <script src="/app-utils.js"></script>
    <script src="/timers.js"></script>
    <script src="/index.js"></script>
    <script src="/translations.js"></script>
    <script src="/sitemap.js"></script>
  </body>
</html>

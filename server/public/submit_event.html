<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submit Event</title>
  <link rel="stylesheet" href="/styles.css" />
</head>

<body>
  <header id="header"></header>

  <main class="protected-main">
    <h1 class="protected-title" data-i18n="submit_event_title">Submit an Event</h1>
    <p class="auth-error" id="eventPageMessage"></p>

    <form class="event-form" id="eventForm" hidden>
      <fieldset class="event-language-section">
        <legend>English</legend>

        <div class="auth-field">
          <label for="eventTitleEn">Event title</label>
          <input type="text" id="eventTitleEn" maxlength="500" />
        </div>

        <div class="auth-field">
          <label for="eventLocationEn">Location</label>
          <input type="text" id="eventLocationEn" maxlength="500" />
        </div>

        <div class="auth-field">
          <label for="eventDescriptionEn">Description</label>
          <textarea id="eventDescriptionEn" rows="5" maxlength="10000"></textarea>
        </div>
      </fieldset>

      <fieldset class="event-language-section">
        <legend>Français</legend>

        <div class="auth-field">
          <label for="eventTitleFr">Titre de l’événement</label>
          <input type="text" id="eventTitleFr" maxlength="500" />
        </div>

        <div class="auth-field">
          <label for="eventLocationFr">Lieu</label>
          <input type="text" id="eventLocationFr" maxlength="500" />
        </div>

        <div class="auth-field">
          <label for="eventDescriptionFr">Description</label>
          <textarea id="eventDescriptionFr" rows="5" maxlength="10000"></textarea>
        </div>
      </fieldset>

      <div class="auth-field">
        <label for="eventStartDate">Start date</label>
        <input type="date" id="eventStartDate" required />
      </div>

      <div class="auth-field">
        <label for="eventEndDate">End date (optional)</label>
        <input type="date" id="eventEndDate" />
      </div>

      <label class="event-checkbox">
        <input type="checkbox" id="eventAllDay" checked />
        All-day event
      </label>

      <label class="event-checkbox" id="publishNowContainer" hidden>
        <input type="checkbox" id="eventPublishNow" />
        Publish immediately
      </label>

      <button type="submit" class="auth-btn" id="eventSubmitButton">
        Submit event
      </button>

      <p class="auth-error" id="eventFormMessage"></p>
    </form>

  </main>

  <footer id="footer"></footer>

  <script src="/index.js"></script>
  <script>
    const eventForm =
      document.getElementById('eventForm');

    const pageMessageEl =
      document.getElementById('eventPageMessage');

    const formMessageEl =
      document.getElementById('eventFormMessage');

    const submitButton =
      document.getElementById('eventSubmitButton');

    const publishNowContainer =
      document.getElementById('publishNowContainer');

    let currentUser = null;

    async function initializeEventPage() {
      const token = localStorage.getItem('token');

      if (!token) {
        window.location.href = '/login.html';
        return;
      }

      try {
        const response = await fetch('/api/me', {
          headers: {
            Authorization: `Bearer ${token}`
          }
        });

        if (response.status === 401) {
          localStorage.removeItem('token');
          window.location.href = '/login.html';
          return;
        }

        if (!response.ok) {
          throw new Error(
            'Could not verify account permissions'
          );
        }

        currentUser = await response.json();

        if (!currentUser.permissions?.canCreateDrafts) {
          document.querySelector(
            '.protected-title'
          ).textContent = 'Access denied';

          pageMessageEl.textContent =
            'Your account does not have permission to submit events.';

          return;
        }

        const canPublishGeneral =
          currentUser.permissions?.canReviewAndPublish === true ||
          (
            currentUser.permissions?.canPublishOwnContent === true &&
            currentUser.contentAreas?.includes('general')
          );

        publishNowContainer.hidden = !canPublishGeneral;
        eventForm.hidden = false;
      } catch (error) {
        pageMessageEl.textContent = error.message;
      }
    }

    eventForm.addEventListener('submit', async event => {
      event.preventDefault();

      formMessageEl.textContent = '';
      formMessageEl.className = 'auth-error';

      const token = localStorage.getItem('token');

      const eventData = {
        title: {
          en: document
            .getElementById('eventTitleEn')
            .value
            .trim(),

          fr: document
            .getElementById('eventTitleFr')
            .value
            .trim()
        },

        location: {
          en: document
            .getElementById('eventLocationEn')
            .value
            .trim(),

          fr: document
            .getElementById('eventLocationFr')
            .value
            .trim()
        },

        description: {
          en: document
            .getElementById('eventDescriptionEn')
            .value
            .trim(),

          fr: document
            .getElementById('eventDescriptionFr')
            .value
            .trim()
        },

        startDate:
          document.getElementById('eventStartDate').value,

        endDate:
          document.getElementById('eventEndDate').value || null,

        allDay:
          document.getElementById('eventAllDay').checked,

        contentArea: 'general',

        publishNow:
          !publishNowContainer.hidden &&
          document.getElementById('eventPublishNow').checked
      };

      if (!eventData.title.en && !eventData.title.fr) {
        formMessageEl.textContent =
          'Enter an English or French event title.';

        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = 'Submitting…';

      try {
        const response = await fetch('/api/events', {
          method: 'POST',

          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${token}`
          },

          body: JSON.stringify(eventData)
        });

        const data = await response.json();

        if (response.status === 401) {
          localStorage.removeItem('token');
          window.location.href = '/login.html';
          return;
        }

        if (!response.ok) {
          throw new Error(
            data.error || 'Could not submit event'
          );
        }

        formMessageEl.className = 'auth-success';
        formMessageEl.textContent = data.message;

        eventForm.reset();

        // reset() unchecks this, but all-day should default to true
        document.getElementById('eventAllDay').checked = true;
      } catch (error) {
        formMessageEl.textContent = error.message;
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Submit event';
      }
    });

    initializeEventPage();
  </script>
  <script src="translations.js"></script>
</body>

</html>

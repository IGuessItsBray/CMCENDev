<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title data-i18n="translations_page_title">
      Manage Translations | CMCEN / RCMCE
    </title>
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <header id="header"></header>

    <main class="dashboard-main translations-admin-main">
      <section
        class="app-shell dashboard-shell translations-admin-shell"
        aria-labelledby="translationsAdminTitle"
      >
        <header class="app-page-header">
          <div class="app-page-header-copy">
            <p
              class="app-eyebrow"
              data-i18n="translations_eyebrow"
            >
              Site administration
            </p>

            <h1
              class="app-page-title"
              id="translationsAdminTitle"
              data-i18n="translations_heading"
            >
              Manage Translations
            </h1>

            <p
              class="app-page-summary"
              data-i18n="translations_intro"
            >
              Review English and French interface text side by side and update existing translation keys.
            </p>
          </div>
        </header>

        <nav
          class="admin-work-zone-tabs admin-work-zone-page-tabs"
          id="adminWorkZoneTabs"
          aria-label="Admin work zone views"
          data-i18n-aria-label="admin_work_zone_tabs_label"
        ></nav>

        <div class="translations-toolbar">
          <div class="event-field translations-search-field">
            <label
              for="translationsSearch"
              data-i18n="translations_search_label"
            >
              Search translations
            </label>
            <input
              id="translationsSearch"
              type="search"
              autocomplete="off"
              data-i18n-placeholder="translations_search_placeholder"
              placeholder="Search by key, English, or French text"
            />
          </div>

          <p
            class="translations-count"
            id="translationsCount"
          ></p>
        </div>

        <p
          class="app-status is-loading is-large review-page-message"
          id="translationsMessage"
          role="status"
          aria-live="polite"
          data-i18n="translations_loading"
        >
          Loading translations...
        </p>

        <div
          class="translations-list"
          id="translationsList"
          hidden
        ></div>
      </section>
    </main>

    <footer id="footer"></footer>

    <script src="/app-utils.js"></script>
    <script src="/index.js"></script>
    <script src="/translations.js"></script>
    <script src="/admin-work-zone-tabs.js"></script>
    <script src="/translations-admin.js"></script>
  </body>
</html>

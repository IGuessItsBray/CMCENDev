<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="translations_page_title">
      Manage Translations | CMCEN / RCMCE
    </title>
    <link
      rel="icon"
      type="image/png"
      href="https://cdn.corebot.ca/cmcen-demo/favicon_crest.png"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <header id="header"></header>

    <main class="dashboard-main translations-admin-main">
      <section
        class="dashboard-shell admin-work-zone-dashboard-shell"
        aria-labelledby="translationsAdminTitle"
      >
        <header class="dashboard-heading translations-admin-heading">
          <div class="dashboard-heading-copy">
            <p class="dashboard-eyebrow" data-i18n="translations_eyebrow">
              Administrator
            </p>

            <h1 id="translationsAdminTitle" data-i18n="translations_heading">
              Manage Translations
            </h1>

            <p class="dashboard-member-name" data-i18n="translations_intro">
              Review English and French interface text side by side and update
              existing translation keys.
            </p>
          </div>
        </header>

        <nav
          class="admin-work-zone-tabs admin-work-zone-page-tabs"
          id="adminWorkZoneTabs"
          aria-label="Admin tools"
          data-i18n-aria-label="admin_tools_tabs_label"
        ></nav>

        <div class="translations-toolbar">
          <div class="event-field translations-search-field">
            <label
              for="translationsSearch"
              data-i18n="translations_search_label"
            >
              Search translations
            </label>
            <input
              id="translationsSearch"
              type="search"
              autocomplete="off"
              data-i18n-placeholder="translations_search_placeholder"
              placeholder="Search by key, English, or French text"
            />
          </div>

          <div class="event-field translations-filter-field">
            <label
              for="translationsStatusFilter"
              data-i18n="translations_filter_label"
            >
              Show
            </label>
            <select id="translationsStatusFilter">
              <option value="all" data-i18n="translations_filter_all">
                All labels
              </option>
              <option
                value="missing-any"
                data-i18n="translations_filter_missing_any"
              >
                Needs a translation
              </option>
              <option
                value="missing-en"
                data-i18n="translations_filter_missing_english"
              >
                Needs English
              </option>
              <option
                value="missing-fr"
                data-i18n="translations_filter_missing_french"
              >
                Needs French
              </option>
            </select>
          </div>

          <button
            class="translations-clear-filters"
            id="translationsClearFilters"
            type="button"
            hidden
            data-i18n="translations_clear_filters"
          >
            Clear filters
          </button>

          <p class="translations-count" id="translationsCount"></p>
        </div>

        <section
          class="translations-browser"
          aria-labelledby="translationsBrowserHeading"
        >
          <div class="translations-browser-heading">
            <div>
              <p class="translations-browser-eyebrow" data-i18n="translations_browse_eyebrow">
                Browse by site area
              </p>
              <h2 id="translationsBrowserHeading" data-i18n="translations_browse_heading">
                Find the part of the site you want to edit
              </h2>
            </div>
            <p data-i18n="translations_browse_intro">
              Choose an area, then open a smaller group of related labels.
            </p>
          </div>

          <div
            class="translations-category-list"
            id="translationsCategoryList"
            aria-live="polite"
          ></div>
        </section>

        <p
          class="review-page-message is-loading"
          id="translationsMessage"
          role="status"
          aria-live="polite"
          data-i18n="translations_loading"
        >
          Loading translations...
        </p>

        <div class="translations-list" id="translationsList" hidden></div>
      </section>
    </main>

    <footer id="footer"></footer>

    <script src="/app-utils.js"></script>
    <script src="/timers.js"></script>
    <script src="/index.js"></script>
    <script src="/translations.js"></script>
    <script src="/admin-work-zone-tabs.js"></script>
    <script src="/translations-admin.js"></script>
  </body>
</html>
